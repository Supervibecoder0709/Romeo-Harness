# Romeo 문서 패키지 정책표 — 확정된 분류(unit·mode·intent·facets·gates·profile)에서
# "어떤 문서·섹션·검토·격리·차단·부품"이 필요한지를 결정론적으로 계산한다.
# 모듈 추가 = 여기에 overlay 행을 추가하는 것이지 새 실행 경로가 아니다(계획 §3.2).
# 근거: capability-map C-B1~B9, C-J1, constraints K-31·K-32·K-60~K-62, decision-register D-04·D-27.
policy_version: "0.1.0"
updated: "2026-08-27"

# ── 문서 종류와 길이 캡 (숫자는 구현하며 검증한다, 계획 §9.3) ─────────────────
documents:
  spec:
    title: Tech Spec
    file: spec.md
    template: core/templates/tech-spec.md
    max_lines: 150
    available_from: M0
  brief:
    title: Compact Brief
    file: brief.md
    template: core/templates/compact-brief.md
    max_lines: 120
    available_from: M2
  charter:
    title: Charter
    file: charter.md
    template: core/templates/charter.md
    max_lines: 250
    available_from: M3

# ── 섹션 카탈로그 ─────────────────────────────────────────────────────────────
# doc: 섹션이 들어가는 문서. T0는 brief가 없으므로 spec에 들어간다(fallback).
# enforcement: 이 절을 **누가 집행하는가**. open-loop(미완료 토큰 검사가 본다 — 문서 패키지 전체를 본다) ·
# block:<id>(그 차단이 본다 — 그 차단의 reads 가 이 절의 문서를 포함해야 한다) · advisory(아무도 읽지 않는다고 **명시**).
# 선언이 없으면 정책이 로드되지 않는다 — 라우터가 필수라고 판정했는데 아무도 읽지 않는 절이 생기지 않게 한다.
sections:
  user-check:
    title: 확인란
    enforcement: [open-loop, block:spec-ready]
    doc: spec
    always: true
    note: 사용자가 이것만 읽고 승인한다(2026-08-27 결정). 문제·기대 결과·수용 기준·위험·되돌리기.
  capsule:
    title: Planning Capsule
    enforcement: [open-loop]
    doc: spec
    max_lines: 20
    note: T0 전용. 기획 파일을 대신한다(D-04).
  change-scope:
    title: 변경 범위
    enforcement: [open-loop]
    doc: spec
    always: true
  work-units:
    title: 구현 단위
    enforcement: [open-loop]
    doc: spec
    always: true
    note: 작고 되돌릴 수 있는 단위마다 목표·변경·확인 방법·복구.
  verification:
    title: 검증 계획
    enforcement: [open-loop]
    doc: spec
    always: true
    note: required_checks — close가 evidence와 대조한다.
  risk-backup-recovery:
    title: 위험·백업·복구
    enforcement: [open-loop, block:risk-plan-ready]
    doc: spec
    note: hard gate 발동 시 필수. 영향 범위·사전 백업·복구 방법·확인할 내용.
  environment-plan:
    title: 환경 계획
    enforcement: [open-loop]
    doc: spec
    note: worktree는 코드만 분리한다. DB·배포·브라우저 세션·외부 서비스 변경 계획을 따로 적는다.
  ui-state-table:
    title: UI 상태표
    enforcement: [open-loop]
    doc: brief
    fallback_doc: spec
    note: 빈·로딩·오류·권한 없음·성공 상태를 화면마다 적는다.
  discovery-plan:
    title: 조사·가설·검증 계획
    enforcement: [open-loop, block:discovery-result]
    doc: brief
    fallback_doc: charter
    note: 첫 마일스톤은 spike. 결과가 기록되기 전에는 구현 dispatch 금지.
  experiment-design:
    title: 실험 설계
    enforcement: [open-loop]
    doc: brief
    fallback_doc: spec
    note: 가설·측정 방법·성공 기준·중단 조건.
  capability-check:
    title: 능력 확인
    enforcement: [open-loop, block:capability-probed]
    doc: spec
    note: 필요한 도구·능력과 프로브 결과. 없으면 BLOCKED_CAPABILITY로 정직 보고(자동 설치 금지). 미완료 토큰 검사만으로는 그럴듯한 거짓 값이 통과한다 — 프로브와 대조하는 차단이 함께 본다.
  evidence:
    title: 증거
    enforcement: [advisory]
    doc: spec
    always: true
    note: close 시 evidence 파일 링크가 채워진다.

# ── 차단 카탈로그 ────────────────────────────────────────────────────────────
# 차단은 "무엇을 막는가"이지 표시가 아니다. base·overlays 가 거는 id 는 전부 여기와
# romeo/blocks.py 의 BLOCK_CHECKS 양쪽에 있어야 하고, 한쪽이라도 없으면 정책 로드가 실패한다
# (romeo.blocks.catalog_defects). 계산만 되고 아무것도 막지 않던 상태가 이 결함의 원래 모양이었다.
# 차단마다 셋을 함께 적는다 — **막기 시작하는 사건 하나**(enforced_at) · **정본 입력 문서**(reads) ·
# **무엇이 참이어야 충족인가**(requires). 하나라도 없으면 정책이 로드되지 않는다.
# enforced_at: approve(=romeo approve) · dispatch(=작업 계약을 쓰는 자리) · close(=romeo close).
# 종료 검사는 걸린 차단을 **전부** 다시 보므로(backstop) enforced_at 에 close 를 더 적지 않는다.
blocks:
  spec-ready:
    title: Tech Spec 승인 준비
    enforced_at: [approve]
    reads: spec
    requires: spec.md 의 「확인란」이 NEEDS_INPUT 없이 채워져 있고 수용 기준 항목이 1건 이상이다(D-60).
  milestone-plan:
    title: 마일스톤 계획
    enforced_at: [approve]
    reads: charter
    requires: charter.md 가 있고 그 「마일스톤 계획」 절이 NEEDS_INPUT 없이 채워져 있다.
  discovery-result:
    title: 조사 결과
    enforced_at: [dispatch]
    reads: brief|charter
    requires: "조사 계획이 사는 문서(brief, 없으면 charter)의 inputs: 에 조사 산출물 링크가 1건 이상 있고 그 경로가 실재한다 — 복사가 아니라 링크다(K-62)."
    note: 승인이 아니라 **구현 위임**에서 막는다. 승인에서 막으면 조사 단위가 조사를 시작할 창구가 없어진다(2026-09-01 실측).
  capability-probed:
    title: 능력 확인 결과가 프로브와 일치
    enforced_at: [approve]
    reads: spec
    requires: "spec.md 의 「능력 확인」 표가 라우터가 요구한 능력을 전부 담고, 각 행의 프로브 id 가 능력 카탈로그에 실재하며, 결과 칸이 프로브가 실제로 낸 라벨과 같고, present 가 아닌 행에 대안이 적혀 있다."
    note: "**없다는 사실 자체는 막지 않는다** — 없는 것을 있다고 적은 거짓과 대안 없는 부재만 막는다. 부재를 막으면 「되는지 조사해 보자」 가 불가능해진다(Q-28). 그 자리에 글자가 있는지가 아니라 그 문장이 참인지를 본다."
  risk-plan-ready:
    title: 위험 계획 준비
    enforced_at: [approve]
    reads: spec
    requires: spec.md 의 「위험·백업·복구」 절이 NEEDS_INPUT 없이 채워져 있다(K-50).
    note: 이것은 **문서가 준비됐는가**다. 되돌리기 어려운 행동을 실행해도 되는가는 guards 가 소유한다(core/policy/execution-guards.yaml · close 의 GUARD_APPROVED). 같은 일을 두 이름으로 하지 않는다.

# ── 기본 패키지 (unit별) ──────────────────────────────────────────────────────
base:
  none:
    package: []
    reviewer: none
    isolation: none
    blocks: []
    note: 답변으로 종료. 분류 카드만 남긴다.
  T0:
    package: [spec]
    reviewer: none
    isolation: current
    blocks: [spec-ready]
    note: classifier 1회 + writer 1회(K-32). 현재 작업 공간.
  T1:
    package: [brief, spec]
    reviewer: opposite-runtime-readonly
    isolation: worktree
    blocks: [spec-ready]
  T2:
    package: [charter, brief, spec]
    reviewer: opposite-runtime-readonly
    isolation: worktree
    blocks: [spec-ready, milestone-plan]

# ── 오버레이 (충돌 우선순위 순서로 평가: hard_gate → execution_block → unit → required → optional → budget) ──
overlays:
  - id: gate.any
    tier: hard_gate
    when: {gates: any}
    add_sections: [risk-backup-recovery]
    set_reviewer: opposite-runtime-readonly
    add_blocks: [risk-plan-ready]
    note: 게이트 영역은 승인 없이 실행하지 않는다. 승인은 Orca gate(M3) 또는 대화 승인 기록.
  - id: gate.ops-boundary
    tier: hard_gate
    when: {gates_any: [migration, ops-data-deletion, availability]}
    add_sections: [environment-plan]
    add_warnings: [WORKTREE_ISOLATES_CODE_ONLY]
  - id: mode.discovery
    tier: required_overlay
    when: {mode: [discovery], unit: [T1, T2]}
    add_sections: [discovery-plan]
    add_blocks: [discovery-result]
    add_parts: [bmad-cis]
  - id: mode.experiment
    tier: required_overlay
    when: {mode: [experiment], unit: [T0, T1, T2]}
    add_sections: [experiment-design]
  - id: facet.ui
    tier: required_overlay
    when: {facets_any: [ui], unit: [T0, T1, T2]}
    add_sections: [ui-state-table]
    add_parts: [design-ui]
  - id: facet.brand
    tier: required_overlay
    when: {facets_any: [brand], unit: [T0, T1, T2]}
    add_parts: [design-landing]
  - id: facet.browser-automation
    tier: required_overlay
    when: {facets_any: [browser-automation]}
    add_sections: [capability-check]
    add_blocks: [capability-probed]
    # 라우터가 요구하는 능력. 카드가 프로브 결과·대안을 인쇄하고, 차단이 「능력 확인」 표를 이것과 대조한다.
    # 절·차단·요구를 같은 자리에서 함께 정한다 — 요구를 적고 집행을 잊는 것이 이 하네스의 반복 결함이다(§11).
    add_capabilities: [automation.ui-control, automation.tool-server]
    add_warnings: [CAPABILITY_CHECK_REQUIRED]
  - id: unit.t2.parts
    tier: required_overlay
    when: {unit: [T2]}
    add_parts: [bmad-cis]
  - id: profile.standard-or-deeper
    tier: optional_overlay
    when: {profile_min: standard, unit: [T0, T1, T2], intent: [write, delete, deploy, mixed]}
    add_parts: [superpowers]
  - id: facet.docs-only-t0
    tier: optional_overlay
    when: {unit: [T0], facets_only: [docs, copy]}
    add_warnings: [DOCS_ONLY_CHANGE]
    note: 코드 검증 대신 문서 검증(스키마·링크·길이)이 required_checks가 된다.
  - id: blast.small.no-reviewer
    tier: optional_overlay
    when: {unit: [T1], blast_radius: [small], uncertainty: [low], gates: none, mode: [delivery], intent: [write]}
    set_reviewer: none
    # 검증은 많이 하는 것이 아니라 **실패 비용에 비례**해야 한다. 그 비례를 만드는 입력값(blast_radius)은
    # 카드에서 사람이 이미 확정하는데, 지금까지 profile 을 올리는 데만 쓰이고 검토자를 정하는 자리에서는
    # 읽히지 않았다 — 그래서 영향 반경이 작다고 확정한 정비 작업도 큰 작업과 같은 코스를 돌았다(17건 실측: T1 15건 전부).
    # **`gates: none` 을 지우지 않는다.** optional_overlay 는 hard_gate 보다 뒤에 평가되므로, 이 조건이 없으면
    # gate.any 가 켠 검토자를 이 행이 덮어써서 꺼 버린다 — 요구를 적고 집행을 잃는 그 결함의 모양이다(AGENTS.core §11).
    # tests/test_policy.py 의 TestBlastSmallDropsReviewer.test_gate_keeps_reviewer 가 그 구현에서 실패한다.
    # **`uncertainty: [low]` 도 지우지 않는다.** 방법이 일부 미정인 요청(medium)은 검토자가 볼 것이 남아 있다 —
    # 이 조건 없이 처음 넣었을 때 실제 세션 로그에서 온 fx-coupang-rocket-badge-automation-plan
    # (브라우저 자동화·외부 연동·불확실성 medium)이 검토자를 잃었고, fixture 대조가 그것을 잡았다(2026-09-02).
    note: 영향 반경이 작고 게이트가 없는 delivery·write 는 검토자 왕복 없이 증거로만 닫는다. 격리(worktree)는 내리지 않는다.

# ── 부품 레지스트리 (라우터가 켜는 대상; 실제 부착 상태는 .harness/romeo.project.yaml이 덮어쓴다) ──
parts:
  superpowers:
    role: 승인 이후 개발 규율(TDD·체계적 디버깅·완료 전 검증·코드 리뷰·worktree)
    gate: G-M2
    status: pending_gate
    adoption: verbatim
  bmad-cis:
    role: 기획 구체화 facilitation — CIS 4종(design-thinking·innovation-strategy·problem-solving·storytelling) 우선, BMAD PRD 양식은 후순위(사용자 실사용 평가 2026-08-27)
    gate: G-M3
    # accepted 는 **채택 결정**이다. 부착(설치) 여부는 .harness/romeo.project.yaml 의
    # modules 가 소유하고, 그것만이 라우터의 status 를 active 로 만든다(K-63).
    # 결정과 설치를 한 값에 담으면 "정했다" 가 "쓸 수 있다" 로 읽힌다.
    status: accepted
    decided: '2026-08-31'
    adoption: install
    # 설치 여부를 확인할 프로브(core/policy/capabilities.yaml). 카드가 추천과 함께 결과를 인쇄한다.
    capability: discovery.bmad
    # 산출물을 작업 단위로 복사하지 않는다. frontmatter 의 inputs: 링크로만 붙인다(K-62).
    output_binding: inputs-link
    # D-77 이 고른 11종. 정식 id 는 provenance/imports.yaml 의 router_recommends 가 소유하고
    # 여기 목록은 그것과 같아야 한다 — fixtures/conflicts/c6-no-second-plan-origin.yaml 이 대조한다.
    # 보류(deferred)·기각(rejected) 판정을 받은 부품은 이 목록에 없다(K-61).
    recommends:
      # discovery 기본·반증 (bmad-core-bmm)
      - bmad-product-brief
      - bmad-prfaq
      - bmad-brainstorming
      - bmad-forge-idea
      # 근거가 부족할 때 (bmad-core-bmm)
      - bmad-domain-research
      - bmad-market-research
      - bmad-technical-research
      # 구조화된 facilitation (bmad-cis)
      - bmad-cis-design-thinking
      - bmad-cis-innovation-strategy
      - bmad-cis-problem-solving
      - bmad-cis-storytelling
  design-ui:
    role: 제품 UI 감사·상태 규칙(WIG·impeccable·ui-ux-pro-max)
    gate: G-M6
    status: pending_gate
    adoption: verbatim
  design-landing:
    role: 랜딩·브랜드 창의 작업(ui-ux-pro-max·taste)
    gate: G-M6
    status: pending_gate
    adoption: verbatim
  openwiki:
    role: 개발 완료 후 기술 문서 파생·자동 관리
    gate: G-M7
    status: pending_gate
    adoption: install

# ── 예산 (초과 시 생략이 아니라 경고, C-A5) ───────────────────────────────────
budgets:
  card_max_lines: 30
  capsule_max_lines: 20
  spec_max_lines: 150
  brief_max_lines: 120
  charter_max_lines: 250

# ── 경고 메시지 카탈로그 ──────────────────────────────────────────────────────
warnings:
  WORKTREE_ISOLATES_CODE_ONLY: worktree는 코드 변경만 분리한다. DB·배포 환경·브라우저 세션·외부 서비스 변경은 분리되지 않으므로 환경 계획을 적는다.
  CAPABILITY_CHECK_REQUIRED: 필요한 도구·능력을 실행 전에 프로브한다. 없으면 가능한 척 우회하지 않고 BLOCKED_CAPABILITY로 보고한다.
  DOCS_ONLY_CHANGE: 문서·규칙만 바뀐다. required_checks는 스키마·링크·길이 검사다.
  GATE_HINT_UNCHECKED: 영역(facet)상 발동해야 할 hard gate가 체크되지 않았다. 사람이 다시 확인한다.
  BUDGET_EXCEEDED: 문서 길이 예산을 넘었다. 게이트 섹션은 생략하지 않는다 — 다른 섹션을 줄인다.
  PART_PENDING_GATE: 라우터가 켜려는 부품이 아직 채택 게이트를 통과하지 않았다. 부품 없이 진행하고 카드에 표시한다.
