# 능력 프로브 정책표 — "필요한 도구가 이 저장소에 설치돼 있는가" 만 본다.
#
# 이 표가 답하지 않는 것: **그 도구가 동작하는가.** 파일이 있다는 것과 런타임이 그것을
# 로드해 실행한다는 것은 다르다(A-11). 그래서 결과 라벨은 `present`·`absent` 둘뿐이고
# `loaded`·`working` 같은 값을 두지 않는다 — 라벨 하나가 실행 주장으로 읽히는 순간
# 프로브는 증거가 아니라 주장이 된다(K-51).
#
# 미설치는 **결함이 아니다.** doctor 는 이 결과를 인쇄만 하고 종료 코드를 바꾸지 않는다.
# 프로브가 있는 이유는 반대다 — 없는 도구를 있는 것처럼 추천하지 않기 위해서다.
#
# 벤더 중립(C-C6): 여기 적는 것은 **부품이 남기는 파일 흔적**이지 도구·모델 이름이 아니다.
# `marker` 는 그 부품의 설치기가 만드는 상태 파일 경로이고, 프로브는 그 파일만 본다.
---
policy_version: "0.1.0"

capabilities:
  discovery:
    bmad:
      title: 기획 구체화 부품(bmad-cis)의 설치 흔적
      part: bmad-cis
      gate: G-M3
      kind: install_trace
      # 설치기가 만드는 상태 파일. 이것이 없으면 설치되지 않은 것이다.
      marker: _bmad/_config/manifest.yaml
      # marker 가 있을 때 거기서 읽어 인쇄할 것. 기록돼 있지 않으면 비워 둔다 — 추정하지 않는다.
      reads: [modules, platform_codes]
      result_labels: [present, absent]
      honesty: 설치 흔적일 뿐 실행 증거가 아니다
      absent_detail: 설치 흔적 없음
      # 이 저장소의 현재 상태. 2026-08-31 D-77 은 부품을 **채택**했을 뿐 설치하지 않았다.
      expected_here: absent
      why: >-
        라우터가 discovery·T2 요청에 이 부품의 스킬 11종을 추천한다. 추천을 인쇄하면서
        설치 여부를 말하지 않으면, 사람은 지금 쓸 수 있는 것으로 읽는다. 추천과 프로브
        결과는 같은 카드에 함께 인쇄한다.
      unverified: >-
        present 분기는 실제 BMAD 설치본이 아니라 marker 파일을 흉내 낸 테스트로만 확인했다.
        manifest 의 키 이름(modules·platform_codes)은 archive/bmad-code-org-BMAD-METHOD/
        04-components-table.md [E05] 의 서술에서 왔고 실물 대조는 하지 않았다 — 기록돼
        있지 않은 키는 비워 두므로 틀려도 없는 값을 지어내지는 않는다.
