# 능력 프로브 정책표 — "필요한 도구가 이 저장소에 설치돼 있는가" 만 본다.
#
# 이 표가 답하지 않는 것: **그 도구가 동작하는가.** 파일이 있다는 것과 런타임이 그것을
# 로드해 실행한다는 것은 다르다(A-11). 그래서 결과 라벨은 `present`·`absent` 둘뿐이고
# `loaded`·`working` 같은 값을 두지 않는다 — 라벨 하나가 실행 주장으로 읽히는 순간
# 프로브는 증거가 아니라 주장이 된다(K-51).
#
# 미설치는 **결함이 아니다.** doctor 는 이 결과를 인쇄만 하고 종료 코드를 바꾸지 않는다.
# 프로브가 있는 이유는 반대다 — 없는 도구를 있는 것처럼 추천하지 않기 위해서다.
#
# 벤더 중립(C-C6): 여기 적는 것은 **부품이 남기는 파일 흔적**이지 도구·모델 이름이 아니다.
# `marker` 는 그 부품의 설치기가 만드는 상태 파일 경로이고, 프로브는 그 파일만 본다.
---
policy_version: "0.1.0"

capabilities:
  discovery:
    bmad:
      title: 기획 구체화 부품(bmad-cis)의 설치 흔적
      part: bmad-cis
      gate: G-M3
      kind: install_trace
      # 설치기가 만드는 상태 파일. 이것이 없으면 설치되지 않은 것이다.
      marker: _bmad/_config/manifest.yaml
      # marker 가 있을 때 거기서 읽어 인쇄할 것. 기록돼 있지 않으면 비워 둔다 — 추정하지 않는다.
      reads: [modules, platform_codes]
      result_labels: [present, absent]
      honesty: 설치 흔적일 뿐 실행 증거가 아니다
      absent_detail: 설치 흔적 없음
      # 이 저장소의 현재 상태. 2026-08-31 D-77 은 부품을 **채택**했을 뿐 설치하지 않았고,
      # 같은 날의 실측(아래 verified)도 **버리는 워크트리**에서 했다 — 설치본은 .gitignore 로 막혀
      # 커밋되지 않는다. 그래서 이 저장소를 새로 체크아웃하면 프로브는 여전히 absent 를 낸다.
      # 값이 present 로 바뀌는 것은 설치본을 저장소에 두기로 결정했을 때뿐이다(지금은 아니다).
      expected_here: absent
      why: >-
        라우터가 discovery·T2 요청에 이 부품의 스킬 11종을 추천한다. 추천을 인쇄하면서
        설치 여부를 말하지 않으면, 사람은 지금 쓸 수 있는 것으로 읽는다. 추천과 프로브
        결과는 같은 카드에 함께 인쇄한다.
      # 2026-08-31 실측으로 대체됐다(feat-20260831-bmad-install-observe-a3bm · run_4d3ee0b42e5a).
      # 원문 기록: .harness/observations.yaml 의 bmad_install
      verified: >-
        present 분기가 **실제 BMAD 설치본에서 돌았다**. 버리는 워크트리에 `npx bmad-method install`
        (core·bmm·cis)을 실행하니 marker(_bmad/_config/manifest.yaml)가 생겼고 doctor 가
        `discovery.bmad: present — 설치 흔적 확인` 을 인쇄했다(exit 0). `reads` 의 두 키
        (modules·platform_codes)는 archive/bmad-code-org-BMAD-METHOD/04-components-table.md [E05]
        의 서술에서 온 이름인데 실물 manifest 에 **둘 다 있었다** — platform_codes 는
        `codex, claude-code`, modules 는 core 6.11.0 · bmm 6.11.0 · cis v0.3.2 였다.
        같은 실행에서 romeo 스킬 38개 파일의 sha256 이 설치 전후로 하나도 바뀌지 않았고,
        두 런타임의 스킬 목록에 bmad-* 59종이 romeo 스킬과 **함께** 나타났다.
      still_unverified: >-
        프로브가 답하는 것은 여전히 **설치 흔적**뿐이다. 목록에 이름이 나타난 것과 그 스킬이 동작하는 것은
        다르다(A-11) — 실제로 호출해 본 것은 11종 중 1종(bmad-cis-design-thinking)이고 그것도 완주시키지
        않았다. `modules` 는 dict 리스트여서 doctor 가 파이썬 repr 그대로(datetime 포함) 인쇄한다 —
        읽히기는 하나 보기 좋지 않고, 아직 다듬지 않았다.

  # ── 화면 조작·외부 도구 서버 ────────────────────────────────────────────────
  #
  # 위 `discovery.bmad` 와 다른 점이 하나 있다: **흔적 경로를 코어가 알지 않는다.**
  # 무엇이 그 능력인가(정의·왜 필요한가·없을 때의 대안)는 여기가 소유하고,
  # 그것을 이 런타임에서 어디서 확인하는가는 **어댑터**(`adapters/*/adapter.yaml` 의
  # `capability_markers`)가 소유한다. 어댑터가 경로를 주지 않으면 그 런타임에서는 `absent` 다 —
  # 모르는 것을 아는 것처럼 적지 않는다(K-51). 코어가 런타임 경로를 알면 그것이 곧 도구명이다(C-C6).
  automation:
    ui-control:
      title: 화면을 직접 조작하는 자동화 능력
      kind: adapter_marker
      result_labels: [present, absent]
      honesty: >-
        어댑터가 선언한 흔적 파일이 있다는 것뿐이다 — 그 능력이 이 세션에서 동작한다는 증거가 아니다(A-11).
      absent_detail: 어댑터가 흔적 경로를 주지 않았거나 그 경로에 파일이 없다
      why: >-
        화면을 사람 대신 조작해 달라는 요청은 그 능력의 유무에 따라 계획 자체가 달라진다.
        없는데 있는 것으로 계획하면 구현자가 가능한 척 우회하거나 자동 설치로 넘어간다 —
        둘 다 이 하네스가 금지한 경로다. 그래서 카드와 「능력 확인」 절이 같은 프로브 결과를 인쇄한다.
      alternatives:
        - 그 단계만 사람이 직접 수행하고 하네스는 앞뒤 단계만 자동화한다
        - 같은 결과를 내는 프로그램 인터페이스가 있는지 먼저 조사한다(별도 조사 단위로 연다)
        - 그 능력이 필요한 단계를 범위에서 빼고 나머지를 먼저 낸다
    tool-server:
      title: 외부 도구 서버를 붙여 쓰는 능력
      kind: adapter_marker
      result_labels: [present, absent]
      honesty: >-
        선언이 저장소에 있다는 것뿐이다 — 그 서버가 붙고 응답한다는 증거가 아니다(A-11).
      absent_detail: 어댑터가 흔적 경로를 주지 않았거나 그 경로에 파일이 없다
      why: >-
        외부 도구 서버는 이 저장소 밖의 상태를 읽고 쓴다(K-66). 있는지 없는지를 말하지 않고 계획에
        넣으면, 승인하는 사람은 이미 붙어 있는 것으로 읽는다. 부재는 막지 않되 반드시 인쇄한다.
      alternatives:
        - 그 서버가 하던 일을 이 저장소 안의 명령으로 바꿀 수 있는지 본다
        - "필요한 데이터를 사람이 내려받아 작업 단위의 inputs: 로 붙인다(K-62)"
        - 붙이는 것 자체를 별도 작업 단위로 열고 승인을 받는다(K-66)
