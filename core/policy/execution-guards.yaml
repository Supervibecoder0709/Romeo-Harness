# Romeo 실행 가드 — "요청이 건드리는 영역"(hard gate)과 다른 층위인 "지금 하려는 행동"의 위험 목록.
# 기획 시점에는 카드에 힌트로만 인쇄하고, 실행 시점에 승인·설명 항목을 강제한다.
# 집행 수단: 역할 계약(M2) + 실행 런타임의 권한 상한(M2) + 실행 런타임의 승인 게이트(M3).
# 게이트를 어떤 명령으로 부르는지는 코어가 모른다 — 어댑터가 소유한다(C-C6). 코어는 결정 기록의 형식만 정한다.
# M0·M1에서는 데이터와 카드 표시만 한다. 승인은 대화 승인 기록(evidence.approvals)으로 남긴다.
# 근거: 원 요청 "안전하게 실행하고 완료를 판정하는 능력", constraints K-50·K-66, 사용자 메모리(안전 브레이크 C).
policy_version: "0.1.0"
updated: "2026-09-02"

# 승인·거부 기록의 note 가 반드시 담아야 하는 네 항목. **이 목록이 설명 요구의 단일 출처다** —
# 라벨을 코드에 복사하지 않는다. 읽는 자리는 `romeo/evidence.py`(기록 시점)와 `romeo/close.py`(종료 시점) 둘이다.
# 요구를 적고 집행을 잊는 것이 이 하네스가 반복해 온 결함의 모양이므로(AGENTS.core §11), 이 목록을
# 늘리거나 라벨을 바꾸면 두 자리가 같은 커밋에서 함께 움직인다.
required_explanation:
  - key: scope
    label: 영향 범위
    why: 무엇이 어디까지 바뀌는가
  - key: backup
    label: 사전 백업
    why: 되돌릴 수 있는 스냅샷이 있는가
  - key: recovery
    label: 복구 방법
    why: 실패 시 정확한 명령·절차
  - key: check
    label: 확인할 내용
    why: 승인자가 보고 판단할 사실

approval:
  # 결정 기록의 **형식**만 코어가 정한다. 승인이든 거부든 note 는 required_explanation 네 항목을 담아야 하고,
  # 담지 않으면 기록이 만들어지지 않는다. 사람에게 무엇으로 묻는가(게이트 호출·응답 수집)는 어댑터의 몫이다.
  record:
    approve: evidence.approvals[{guard, approved_at, approved_by, note, log, log_sha256}]
    reject: evidence.rejections[{guard, rejected_at, rejected_by, note, log, log_sha256}]
  rule: 승인 전 상태 변경 0건. 승인 없이 실행하면 BLOCKED_APPROVAL 로 종료하고 evidence를 무효로 본다.
  last_decision: 한 가드의 판정은 **가장 최근 결정**이다. 마지막이 거부면 BLOCKED_APPROVAL 로 종결된 것이고,
    "아직 안 물어봤다"와 다른 판정이다 — 재시도가 답이 아니다. 거부 뒤 사람이 다시 승인하면 승인이 이긴다.

guards:
  - id: payment-charge
    name: 비용 결제
    examples: [유료 API 대량 호출, 이미지 생성, 도메인·플랜 구매, 크레딧 사용]
    triggers: {facets: [payment, ai-cost], intent: [write, deploy, mixed]}
  - id: permission-escalation
    name: 권한 확대
    examples: [토큰 스코프 확대, IAM 정책 변경, sudo, 새 시크릿 발급]
    triggers: {actions: [escalate, token-scope, iam]}
  - id: public-exposure
    name: 공개 전환
    examples: [private → public 저장소, 공개 URL 배포, 문서 외부 공유]
    triggers: {actions: [publish, share, expose]}
  - id: production-deploy
    name: 운영 배포
    examples: [VPS 재배포, 프로덕션 빌드 반영, 서비스 재시작]
    triggers: {intent: [deploy, mixed]}
  - id: ops-data-change
    name: 운영 데이터 변경
    examples: [운영 DB 쓰기, 고객·주문·계정 데이터 수정, 대량 갱신]
    triggers: {facets: [ops-data], intent: [write, delete, deploy, mixed]}
  - id: db-migration
    name: 데이터베이스 마이그레이션
    examples: [스키마 변경 적용, 데이터 이전 실행]
    triggers: {facets: [migration], intent: [write, deploy, mixed]}
  - id: account-ownership
    name: 계정·소유권 변경
    examples: [소유자 이전, 계정 삭제·병합, 결제 수단 변경]
    triggers: {actions: [transfer, ownership]}
  - id: deletion
    name: 삭제
    examples: [파일·디렉터리 삭제, 아카이브 삭제, 리소스 파기]
    triggers: {intent: [delete, mixed]}
  - id: main-merge
    name: main 병합
    examples: [PR merge, 기본 브랜치 fast-forward]
    triggers: {actions: [merge]}
  - id: workspace-deletion
    name: 다른 작업 공간 삭제
    examples: [git worktree remove, 다른 세션의 worktree 정리]
    triggers: {actions: [worktree-remove]}
  - id: external-transfer
    name: 외부 전송·게시
    examples: [git push, PR 생성, 메시지 발송, 외부 API로 데이터 전송]
    triggers: {actions: [push, pr, send, upload]}

# trigger 의미: 적힌 키(intent / facets / actions)가 모두 맞아야 발동한다(AND). 없는 키는 조건 없음.

# 집행 수단 초안 (M2에서 어댑터가 실제 설정으로 컴파일한다)
enforcement:
  claude:
    permission_deny:
      - "Bash(git push*)"
      - "Bash(gh pr merge*)"
      - "Bash(git worktree remove*)"
      - "Bash(rm -rf /*)"
  codex:
    reviewer_sandbox: read-only
    approval_policy: on-request
