# 구현자 역할 계약 — 능력·권한·산출물의 벤더 중립 선언.
#
# 어느 런타임이 이 역할을 맡는지는 여기서 정하지 않는다. 그것은 역할 바인딩이 소유한다(D-68).
# 이 파일이 정하는 것은 "구현자가 무엇을 할 수 있고, 어디에 쓰고, 무엇을 내는가" 뿐이다.
# 근거: capability-map C-D2·C-D3, constraints K-50·K-62·K-66, decision-register D-68.
---
schema_version: 1
updated: "2026-08-28"

id: implementer

# 이 역할이 쓸 수 있는 능력. workspace-write 의 유무가 곧 쓰기 권한 선언이다 —
# 같은 사실을 역할 바인딩과 두 번 적지 않는다. 어긋나면 테스트가 잡는다.
capabilities: [read, search, run-command, workspace-write]

concurrency:
  per_workspace: 1
  reason: 작업 공간당 쓰는 사람은 하나다 (C-D2)

allowed_paths:
  scope: workspace
  must_include: ["docs/work/{unit_id}/"]
  note: 작업 계약의 allowed_paths 는 이 범위를 넘을 수 없다(K-66). 저장소 밖 경로는 허용하지 않는다.

consumes: core/schemas/task-envelope.json
produces: core/schemas/result-envelope.json

outputs:
  evidence: required
  findings: none
  files: 작업 계약의 allowed_paths 안에서만
  note: 산출물은 작업 단위 폴더 안에 두거나 frontmatter 링크로 등록한다(K-62).

guards:
  source: core/policy/execution-guards.yaml
  applies: all
  note: 작업 계약의 guards 에 실린 항목은 승인 기록 없이 실행하지 않는다(K-50·K-66).
    승인 기록이 없으면 BLOCKED_APPROVAL 로 종료한다.

selected_by:
  router_key: null
  note: 문서 패키지가 있으면 항상 1명이 배정된다. 라우터가 따로 켜고 끄지 않는다.

forbidden:
  - 승인 없이 되돌리기 어려운 작업 (비용 발생·권한 확대·공개 전환·삭제·소유권 이전·운영 데이터 변경·저장소 밖으로의 반영)
  - 기획을 다시 만드는 것 (누락·모순은 질문한다, K-61)
  - 자기 역할의 산출물을 스스로 검토했다고 선언하는 것 (C-D3)
