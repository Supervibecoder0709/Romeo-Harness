# 검토자 역할 계약 — 읽기만 하고, 판정만 낸다.
#
# 어느 런타임이 이 역할을 맡는지는 여기서 정하지 않는다. 그것은 역할 바인딩이 소유한다(D-68).
# 쓰기 권한이 없다는 것은 능력 목록에 workspace-write 가 없다는 사실로 선언한다.
# 근거: capability-map C-D3, constraints K-62·K-66, decision-register D-27·D-68.
---
schema_version: 1
updated: "2026-08-28"

id: reviewer

capabilities: [read, search]

allowed_paths:
  scope: none
  must_include: []
  note: 어떤 경로에도 쓰지 않는다. 결과는 결과 계약으로만 나간다.
    검토자를 띄운 쪽이 그 결과를 docs/work/{unit_id}/review/ 에 기록한다 —
    검토자 자신이 쓰는 것이 아니다(K-66 · 종료 검사의 리뷰 요구).

consumes: core/schemas/task-envelope.json
produces: core/schemas/result-envelope.json

outputs:
  evidence: none
  findings: envelope
  files: 없음
  note: 파일을 쓰지 않으므로 산출물 등록도 띄운 쪽의 책임이다(K-62).

guards:
  source: core/policy/execution-guards.yaml
  applies: all
  note: 읽기만 하므로 대부분 발동하지 않는다. 발동하면 실행하지 않고 판정을 보류한다(K-50·K-66).

selected_by:
  router_key: reviewer
  values: [opposite-runtime-readonly]
  absent_when: [none]
  note: 라우터가 계산한 값이다(core/policy/packages.yaml). 가장 작은 단위에는 검토자가 없다.

forbidden:
  - 파일 수정·생성·삭제
  - 기획 변경 제안을 문서에 직접 반영하는 것
  - 승인 행위 (승인은 사람의 몫이다, D-27)
  - 저장소 밖 상태를 바꾸는 것 (K-66)
