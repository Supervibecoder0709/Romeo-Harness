# Claude Code 어댑터 정의. `romeo compile` 이 읽는다.
# 코어(벤더 중립)를 이 런타임의 경로·도구명으로 옮기는 규칙만 담는다.
---
id: claude
name: Claude Code
instructions_file: CLAUDE.md
skills_dir: .claude/skills
settings_file: .claude/settings.json

# 코어 워크플로 → 이 런타임의 스킬. description 을 적으면 코어 것 대신 쓴다
# (discovery 가 실제로 관찰된 문구를 유지하기 위해서다 — K-68).
workflows:
  plan:
    mapping: adapters/claude/workflows/plan.md
    description: >-
      Romeo 라우터. 새 요청을 받으면 사실·가정·미확인·분류 후보를 제안 카드로 정리하고, 사용자가 1클릭으로
      확정하면 정책표로 문서 패키지를 계산해 docs/work/<id>/ 에 필요한 문서만 만든다. 사용자가 "/plan",
      "이 요청 분류해줘", "계획 잡아줘", "어떻게 진행할지 정해줘"라고 하거나 새 작업 요청을 가져올 때 사용한다.
      구현은 하지 않는다.
  plan-close:
    mapping: adapters/claude/workflows/plan-close.md
    description: >-
      Romeo 종료 검사. docs/work/<id>/ 작업 단위의 evidence 신선도(HEAD SHA·작업 트리)·required_checks·수용 기준·
      open loop·링크를 검사해 통과하면 status 를 done 으로 확정한다. 사용자가 "/plan-close", "이 작업 마무리해",
      "완료 처리해줘", "close 해줘"라고 할 때 사용한다. 검사가 실패하면 완료라고 하지 않는다.

# 채택된 vendor 스킬을 이 런타임 경로로 투영한다(원문 그대로, 수정 0).
project_vendor_skills: true

# 이 저장소가 자체 보유한 스킬 중 이 런타임으로 투영할 것.
local_skills: []

# 실행 가드. `.claude/settings.json` 의 permissions.ask·deny 만 하네스가 소유하고,
# 그 밖의 키(사용자 개인 설정)는 컴파일이 건드리지 않는다.
# 근거는 .harness/bindings.yaml 의 overrides.integration_commands 이고, 아래는 그것을 이 런타임의
# 패턴 문법으로 옮긴 것이다(K-66).
#
# ask  = 되돌리기 어렵지만 정당한 작업. "승인 없이 실행하지 않는다" 를 그대로 구현한다 — 매번 확인한다.
# deny = 승인으로도 정당화되지 않는 것. 프롬프트 없이 거부한다.
settings_ask:
  - "Bash(git push:*)"
  - "Bash(gh pr create:*)"
  - "Bash(gh pr merge:*)"
  - "Bash(git worktree remove:*)"
  - "Bash(git worktree prune:*)"
  - "Bash(git branch -D:*)"
  - "Bash(git reset --hard:*)"
  - "Bash(git stash:*)"
  - "Bash(gh api:*)"
  - "Bash(gh pr comment:*)"
  - "Bash(gh pr review:*)"
  - "Bash(git worktree add:*)"

settings_deny:
  - "Bash(rm -rf /*)"
  - "Bash(rm -rf ~/*)"
  - "Bash(sudo rm:*)"
  - "Bash(git push --force:*)"
  - "Bash(git push -f:*)"
