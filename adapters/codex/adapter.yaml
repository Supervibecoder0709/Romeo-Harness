# Codex 어댑터 정의. `romeo compile` 이 읽는다.
---
id: codex
name: Codex CLI
instructions_file: AGENTS.md
skills_dir: .agents/skills
settings_file: null

workflows:
  plan:
    mapping: adapters/codex/workflows/plan.md
  plan-close:
    mapping: adapters/codex/workflows/plan-close.md
  # 아래 둘은 진입점이 아니다. `when` 이 지침 파일의 절차 표에 그대로 인쇄된다(K-60).
  # description 은 적지 않는다 — 코어 frontmatter 값을 그대로 쓴다.
  implement:
    mapping: adapters/codex/workflows/implement.md
    when: 승인 뒤 라우터가 켤 때만
  review:
    mapping: adapters/codex/workflows/review.md
    when: 승인 뒤 라우터가 켤 때만

# 역할 계약을 이 런타임의 에이전트 정의 파일로 투영하지 **않는다**.
#
# 계획 §5.1 은 `.codex/agents/*.toml` 을 M2 산출물로 적었지만, 그 형식을 이 런타임이 읽는다는
# 근거를 찾지 못했다(2026-08-28 대조):
#   - 설치된 실행 파일의 문자열에 `.codex/agents` 가 0건이다. 나오는 저장소 상대 경로는
#     `.codex/config.toml` 뿐이고 그것도 홈 디렉터리 기준 설명문에서만 나온다.
#   - 프로필은 홈 설정 디렉터리의 `<이름>.config.toml` 을 겹쳐 읽는다 — 저장소 파일이 아니다.
#   - 저장소 기준으로 발견이 **관찰된** 경로는 `.agents/skills/` 와 `AGENTS.md` 두 개뿐이다
#     (.harness/observations.yaml 의 runtime_load).
#   - 계획이 인용한 근거는 archive/first-fluke-oh-my-agent 의 제3자 서술이고, 이 버전에
#     대한 관찰이 아니다.
# 확인하지 못한 형식으로 파일을 만들면 "있는데 읽히지 않는" 산출물이 된다 — 안 만드는 것보다 나쁘다.
# 그래서 이 런타임의 역할 투영은 지침 파일 managed block 하나로 한다(양쪽이 같은 역할 계약을 받는다).
agents_dir: null
agents_dir_status: 미확인 — 저장소에 커밋해 발견되는 에이전트 정의 형식을 확인하지 못했다 (2026-08-28)

# 권한 상한(.harness/bindings.yaml 의 permission_ceiling)을 이 런타임에서 어떻게 전달하는가.
# settings_file 이 null 이라 기계 강제 대상 파일이 없다 — 기동 플래그와 지침 인쇄로 대신한다.
permission_ceiling:
  kind: launch_flags
  delivery: >-
    기동 플래그(샌드박스 모드)와 지침 파일 인쇄로 전달한다. 이 런타임에는 저장소에 커밋해
    발견되는 권한 설정 파일이 없고, 비대화형 실행에는 승인 정책 플래그도 없다 —
    승인 게이트는 하네스가 소유한다(승인 기록 없이 실행하지 않는다).

project_vendor_skills: true

# 기존 심링크(.agents/skills/repo-archive)를 실제 파일로 대체한다 —
# Windows 에서 심링크가 깨지는 문제를 피한다(계획 §7 M2 검증 항목).
local_skills:
  - name: repo-archive
    source: skills/repo-archive

# 능력 흔적 경로(core/policy/capabilities.yaml 의 `kind: adapter_marker`).
#
# **경로를 주지 않는다.** 이 런타임에서 저장소에 커밋해 발견되는 도구 서버 선언 경로를 확인하지 못했다 —
# `agents_dir` 를 비워 둔 것과 같은 이유다(2026-08-28 대조). 확인하지 못한 경로를 적으면 프로브가
# 그 경로의 부재를 능력의 부재로 말하게 되는데, 그것은 관찰이 아니라 추측이다(K-51).
# 빈 목록은 "이 런타임에서는 absent" 로 읽힌다 — 키를 지우는 것과 달리 **모른다고 적은 결정**이다.
capability_markers:
  automation.ui-control: []
  automation.tool-server: []
