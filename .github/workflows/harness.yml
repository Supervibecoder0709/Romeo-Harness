name: harness

# Romeo 하네스 자체 검사. 네트워크 없이 도는 것만 넣는다 —
# vendor/ 대조는 blob SHA 를 imports.yaml 에 기록해 두었으므로 upstream 을 다시 받지 않는다(계획 §6.2).
on:
  push:
    branches: [main]
    paths:
      - 'romeo/**'
      - 'bin/romeo'
      - 'core/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'vendor/**'
      - 'provenance/**'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/harness.yml'
  pull_request:
    paths:
      - 'romeo/**'
      - 'bin/romeo'
      - 'core/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'vendor/**'
      - 'provenance/**'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/harness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: PyYAML 설치
        run: python3 -m pip install --quiet PyYAML

      - name: unittest
        run: python3 -m unittest discover -s tests -v

      - name: 정책표 fixture 리포트 (일치율·gate 누락)
        run: bin/romeo route --fixtures fixtures/requests --report

      - name: fixture 스키마 검사
        run: bin/romeo fixtures check

      - name: 작업 문서 검증
        run: bin/romeo validate

      # 외부 자산이 원문 그대로인지(수정 0) + 코어의 provenance id 가 등록돼 있는지
      - name: vendor 대조 · provenance id
        run: bin/romeo vendor check

      - name: THIRD_PARTY_NOTICES 신선도
        run: bin/romeo notices --check

      - name: 실패 시 안내
        if: failure()
        run: |
          echo "::error::vendor 대조 실패는 원문 수정을 뜻합니다. 되돌리려면 해당 파일을 upstream 고정 SHA 에서 다시 받으세요."
          echo "::error::NOTICES 실패는 'bin/romeo notices' 재생성 후 커밋하면 됩니다."
