name: harness

# Romeo 하네스 자체 검사. 네트워크 없이 도는 것만 넣는다 —
# vendor/ 대조는 blob SHA 를 imports.yaml 에 기록해 두었으므로 upstream 을 다시 받지 않는다(계획 §6.2).
on:
  # 작업 브랜치에서도 돈다 — main 에 합치기 전에 회귀를 잡는 것이 이 검사의 목적이다.
  push:
    paths:
      - 'romeo/**'
      - 'bin/romeo'
      - 'core/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'vendor/**'
      - 'provenance/**'
      - 'adapters/**'
      - 'fixtures/conflicts/**'
      - '.harness/bindings.yaml'
      - '.claude/skills/**'
      - '.agents/skills/**'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.claude/settings.json'
      - '.harness/compiled.yaml'
      - '.harness/bindings.yaml'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/harness.yml'
  pull_request:
    paths:
      - 'romeo/**'
      - 'bin/romeo'
      - 'core/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'vendor/**'
      - 'provenance/**'
      - 'adapters/**'
      - 'fixtures/conflicts/**'
      - '.harness/bindings.yaml'
      - '.claude/skills/**'
      - '.agents/skills/**'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.claude/settings.json'
      - '.harness/compiled.yaml'
      - '.harness/bindings.yaml'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/harness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 전체 이력을 받는다. 기본값(fetch-depth: 1)은 얕은 클론이라
      # 관측 parity 케이스의 앵커 검사가 도는 자리에서 base_sha 커밋을 찾지 못한다 —
      # `TASK_ANCHORED` 는 작업 계약을 그 커밋의 spec 에서 **다시 계산해** 바이트로 대조하고
      # `BASE_SHA` 는 그 커밋이 이 이력의 조상인지 본다. 둘 다 커밋 자체가 있어야 성립한다.
      # 2026-08-29 실측: 얕은 클론에서 봉투 4개가 전부
      # `base_sha 로 쓸 커밋을 찾을 수 없다` 로 PARITY_INVALID 가 됐다.
      # 이 줄을 지우면 관측 케이스가 조용히 구조 오류가 되고, 그때 고치고 싶어지는 것은
      # CI 가 아니라 케이스다 — 그것이 D-b 가 막으려는 행동이다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: PyYAML 설치
        run: python3 -m pip install --quiet PyYAML

      - name: unittest
        run: python3 -m unittest discover -s tests -v

      - name: 정책표 fixture 리포트 (일치율·gate 누락)
        run: bin/romeo route --fixtures fixtures/requests --report

      - name: fixture 스키마 검사
        run: bin/romeo fixtures check

      # 동등성 판정은 두 층이다(D-b). 여기서 강제하는 것은 **검사기 자기 검증** 뿐이다 —
      # 합성 케이스(source.kind: authored)가 선언한 대로 판정되는가, 케이스 파일이 구조적으로 유효한가.
      # 게이트 판정 자체는 실제 교차 실행 관측이 있어야 성립하므로 아래 스텝에서 인쇄만 한다.
      - name: 동등성 검사기 자기 검증 (강제)
        run: python3 -m unittest tests.test_parity -v

      # 판정은 **종료 코드가 아니라 기계 판독 출력**으로 읽는다.
      # `bin/romeo fixtures parity` 는 게이트 FAIL 과 미판정(관측 0건)을 똑같이 종료 코드 1 로 내므로
      # 종료 코드만으로는 둘을 구분할 수 없다 — 그래서 `|| echo` 로 넘기면 '미판정을 넘긴다' 는
      # 의도와 함께 관측이 생긴 뒤의 **게이트 FAIL 까지** 삼킨다.
      #
      # 대응: 게이트 FAIL · 구조 오류(PARITY_INVALID) · 검사기 FAIL · 합성 0건 → CI 실패.
      #       미판정(관측 0건)만 경고로 넘긴다.
      # 관측이 생기면 사람이 이 줄을 지우지 않아도 그때부터 저절로 강제된다.
      - name: 동등성 게이트 판정 (FAIL 이면 CI 실패 · 관측 0건이면 미판정)
        run: |
          # 산출물은 작업 트리 밖에 둔다 — 뒤따르는 검사가 보는 트리를 더럽히지 않는다.
          REP="${RUNNER_TEMP:-/tmp}/parity-report.json"
          ERR="${RUNNER_TEMP:-/tmp}/parity-invalid.txt"
          bin/romeo fixtures parity --report || true
          bin/romeo fixtures parity --json > "$REP" 2> "$ERR" || true
          if [ ! -s "$REP" ]; then
            cat "$ERR"
            echo "::error::parity 케이스가 구조적으로 유효하지 않다(PARITY_INVALID). 관측이라고 선언한 케이스는 source.ref·unit_id·evidence_ref 가 저장소에 실재해야 한다."
            exit 1
          fi
          read_field() { python3 -c "import json,sys;print(json.load(open(sys.argv[1]))[sys.argv[2]])" "$REP" "$1"; }
          gate=$(read_field gate_verdict)
          checker=$(read_field checker_verdict)
          synthetic=$(read_field synthetic)
          observed=$(read_field observed)
          echo "gate_verdict=$gate · checker_verdict=$checker · 관측 ${observed}건 · 합성 ${synthetic}건"
          rc=0
          if [ "$gate" = "FAIL" ]; then
            echo "::error::핵심 동등성 게이트 FAIL — 관측된 역할 교체 실행에서 판정이 갈렸다. 리포트의 불일치 행을 본다."
            rc=1
          fi
          if [ "$checker" = "FAIL" ]; then
            echo "::error::검사기 자기 검증 FAIL — 합성 케이스가 선언한 대로 판정되지 않는다."
            rc=1
          fi
          if [ "$synthetic" = "0" ]; then
            echo "::error::합성 케이스가 0건이다 — 검사기를 검증할 것이 없다. fixtures/parity 를 확인한다."
            rc=1
          fi
          if [ "$gate" = "UNDETERMINED" ]; then
            echo "::warning::핵심 동등성 게이트 미판정 — 관측 케이스 0건이다(합성은 검사기 검증용). 실제 교차 실행 관측이 1건 생기면 이 스텝이 그때부터 판정한다."
          fi
          exit $rc

      - name: 작업 문서 검증
        run: bin/romeo validate

      # 어댑터 산출물이 코어와 일치하는지. 손으로 고친 managed block 도 여기서 걸린다.
      - name: 어댑터 컴파일 대조
        run: bin/romeo compile --check

      # 외부 자산이 원문 그대로인지(수정 0) + 코어의 provenance id 가 등록돼 있는지
      - name: vendor 대조 · provenance id
        run: bin/romeo vendor check

      - name: THIRD_PARTY_NOTICES 신선도
        run: bin/romeo notices --check

      # 부착 검증(K-68). --scope repository 를 쓴다 — CI 러너에 claude/codex/orca 가 없는 것은
      # 저장소의 문제가 아니라 그 머신의 사실이다.
      - name: 부착 검증 · 충돌 fixture (K-68)
        run: bin/romeo doctor --strict --scope repository

      - name: 실패 시 안내
        if: failure()
        run: |
          echo "::error::vendor 대조 실패는 원문 수정을 뜻합니다. 되돌리려면 해당 파일을 upstream 고정 SHA 에서 다시 받으세요."
          echo "::error::compile 실패는 'bin/romeo compile' 재생성 후 커밋하면 됩니다."
          echo "::error::NOTICES 실패는 'bin/romeo notices' 재생성 후 커밋하면 됩니다."
