name: archive index

# archive/ 가 바뀌면 archive/README.md 인덱스가 최신인지 검사한다.
# 검사만 하고 커밋하지 않으므로 이 워크플로는 레포에 쓰기 권한이 필요 없다.
# 인덱스를 갱신하려면 `python3 scripts/generate-archive-index.py` 를 돌려 결과를 커밋한다.
on:
  push:
    branches: [main]
    paths:
      - 'archive/**'
      - 'scripts/generate-archive-index.py'
      - '.github/workflows/archive-index.yml'
  pull_request:
    paths:
      - 'archive/**'
      - 'scripts/generate-archive-index.py'
      - '.github/workflows/archive-index.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 인덱스 최신 여부 검사
        run: python3 scripts/generate-archive-index.py --check

      # 실패했을 때 어디가 다른지 로그에 남겨 재생성 없이도 원인을 알 수 있게 한다.
      - name: 실패 시 차이 출력
        if: failure()
        run: |
          python3 scripts/generate-archive-index.py
          echo "::group::archive/README.md 예상 결과와의 차이"
          git --no-pager diff -- archive/README.md
          echo "::endgroup::"
          echo "::error::인덱스가 오래되었습니다. 'python3 scripts/generate-archive-index.py' 실행 후 결과를 커밋하세요."
