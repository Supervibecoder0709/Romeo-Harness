id: fx-vps-redeploy
request_text: '이 워크트리는 Supervibecoder0709/discord-setup 브랜치(HEAD 70b8d35, PR #62가 방금 main에 병합된 버전 + 마지막 1줄 수정 포함)에서
  파생됐다. 네 작업은 이 최신 코드를 실 운영 VPS에 재배포하는 것이다 — 코드 수정 작업이 아니라 배포·운영(ops) 작업이다. ## 배경 PR #62 최종 통합 리뷰(16건)의 수정 코드가 방금
  main에 병합됐다. 그런데 실 운영 VPS는 이보다 이전 커밋(§9-2/§9-10/D-Wx 결함 수정분까지만)이 떠 있다. 즉 아래 항목들이 VPS에는 아직 반영되지 않았다: - `platform/door/systemd/coupang-door.service`
  하드닝: `ProtectHome=yes`, `RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX` 추가, `MemoryHigh=200M`/`MemoryMax=256M`(soft<hard
  순서 정정, 이전엔 300M/256M로 역전돼 있었음) - `discard()` WorkerPort 7번째 연산(거부 경로 prepared 토큰 폐기) - `operator force-release-ownership`에
  `--confirmed-dead` 필수 플래그 - 격리 24h 도래 1h 주기 재알림 타이머 - `transition_denied`에서 워치독 disarm 안 하는 수정 - 기타 내부 리팩터(동작
  변화 없음): manifest 파일명 상수화, operator/retry-decision 순수 함수 추출 등 ## 할 일 1. `docs/discord-infra/door-deployment.md`를
  처음부터 끝까지 읽어라. 이 프로젝트의 배포 절차는 **git clone이 아니라 rsync 기반**이고, 문서 안에 과거 배포 사고에서 얻은 함정들이 명시돼 있다(예: `rsync --delete`는
  전송 트리 안에서만 동작, 호스트 설치 rsync엔 `--delete`가 없어 구 피처가 누적됨, `features/` 전체를 보내면 안 됨, RuntimeDirectory=를 안 쓰고 tmpfiles.d로
  콜백 소켓 디렉토리를 만드는 이유 등). 이 문서에 적힌 순서·주의사항을 그대로 따르되, 최신 상황(이번엔 systemd unit 파일도 바뀌었다)에 맞게 적용해라. 2. VPS 접속: `ssh <email>`
  (Lightsail 고정 IP, 키 인증 이미 설정돼 있음. 접속 안 되면 Lightsail 콘솔 브라우저 SSH가 복구 경로 — `docs/discord-infra/door-vps-setup.md`
  참고). 3. `platform/door`를 빌드하고(`npm run build` 등 — package.json 스크립트 확인), dist/node_modules를 문서 절차대로 `/opt/coupang-door`에
  rsync해라. **이번엔 코드뿐 아니라 systemd unit 파일도 바뀌었으니 `platform/door/systemd/`도 문서에 적힌 방식대로 VPS에 반영해라** (`rsync -avz platform/door/systemd/
  <email>:/tmp/door-systemd/` 후 `sudo`로 `/etc/systemd/system/`에 설치). 4. `sudo systemctl daemon-reload && sudo systemctl
  restart coupang-door.service`. 5. 재기동 뒤 반드시 실측으로 검증해라: - `sudo systemctl show coupang-door.service -p ProtectHome
  -p RestrictAddressFamilies -p MemoryHigh -p MemoryMax` 출력이 위 값들과 일치하는지 - `sudo systemctl status coupang-door.service`로
  active(running) 확인, 재기동 루프(flapping) 없는지 - 저널 로그(`journalctl -u coupang-door.service -n 100`)에 부팅 프로브(A2/A4 등,
  `door-deployment.md`에 절차 있음) 에러 없이 정상 부팅했는지 6. 검증까지 끝나면 `docs/discord-infra/door-deployment.md`에 이미 있는 배포 기록 관례(§9.x
  계열 섹션)를 따라 이번 재배포 실측 결과를 한 섹션 추가해라 — 날짜, 반영된 항목, 실측 systemctl show 값을 남겨라. (기존 §9.1~§9.4가 있다면 그 다음 번호로.) 7. 코드
  자체는 수정할 필요가 없다(이미 main에 병합됨). 만약 배포 중 예상 밖 실패를 발견해서 코드 수정이 꼭 필요해지면, 원인을 정확히 지목하고 최소 수정만 한 뒤 이 워크트리 브랜치(Supervibecoder0709/door-hardening-vps-redeploy)에
  커밋·push해라 — 병합은 내가(메인 세션) 확인 후 처리한다. ## 완료 보고 끝나면: (a) 무엇을 rsync했는지, (b) systemctl show 실측값 원본 출력, (c) journalctl
  부팅 로그 요약, (d) door-deployment.md에 추가한 섹션, (e) 이 프로젝트 CLAUDE.md §4 형식대로 "📌 대신 결정한 것"·"🛠️ 사용한 스킬/에이전트"를 응답 마지막에
  남겨라.'
