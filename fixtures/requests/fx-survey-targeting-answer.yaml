id: fx-survey-targeting-answer
request_text: '이 사업을 계속 전개하기 위해 특정한 가설을 세워서 유저 리서치를 진행하려고해. 서베이 전문 업체에 맡기고 싶은데, @Strategy/ 의 최신 기획 문서와 아이데이션한 산출물들
  기반으로 아래 내용에 답변해주면 좋겠어. * 8. 설문 응답자의 타깃팅 조건을 모두 가급적 구체적으로 기입해주세요. 📌 예: 연령대, 성별, 거주 지역, 관심사, 특정 제품 구매 경험 등 📌 타깃팅
  조건이 늘어날수록 모집 비용이 증가하고 그에 따라 모집 가능한 표본 수가 감소할 수 있습니다. [주관식 입력] 9. 조사를 통해 검증하고 싶은 첫 번째 주요 가설은 무엇입니까? 📌 예: 20대 여성은
  가격보다 디자인을 더 중요하게 고려할 것이다 📌 특별한 가설이 없을 경우, 공란으로 두셔도 됩니다. [주관식 입력] 10. 조사를 통해 검증하고 싶은 두 번째 주요 가설은 무엇입니까? 📌 특별한 가설이
  없을 경우, 공란으로 두셔도 됩니다. [주관식 입력] 11. 조사를 통해 검증하고 싶은 세 번째 주요 가설은 무엇입니까? 📌 특별한 가설이 없을 경우, 공란으로 두셔도 됩니다. [주관식 입력] *
  12. 설명형 문항 삽입을 원하십니까? 📌 설문지 내에 제품/서비스의 사진·설명·시안 등을 삽입하여, 응답자가 내용을 반드시 확인한 후 설문에 응답하도록 하는 문항입니다. [Yes/No] => 이
  내용들은 단순히 서베이 업체가 서베이 진행중 필요한 내용을 우리한테 요청한 건데, 채울 수 있는 만큼만 채우고 답변할 수 없는 항목들은 그대로 비워둬. 그리고, 항목 답변과 무관하게 네가 지금 우리
  제품에 대한 오픈 서베이나 리서치, 인터뷰를 진행한다면 어떤 가설을 가지고 무엇을 확인하는 게 가장 우선순위일지 고민해보고 답변해줘.'
