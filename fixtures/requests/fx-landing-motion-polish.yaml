id: fx-landing-motion-polish
request_text: '현재 만들어진 랜딩페이지의 디자인, 콘텐츠, 컬러, 타이포그래피와 섹션 순서는 유지하면서 모션과 스크롤 인터랙션만 보강해줘. 레퍼런스: * <url> * <url> * <url>
  Taste Skill 관련 스킬만 사용하고 UI UX Pro Max는 사용하지 마. 레퍼런스를 그대로 복제하지 말고, 섹션 전환의 리듬, 제품 화면 reveal, sticky 콘텐츠, 절제된 parallax와
  텍스트 모션을 현재 디자인에 맞게 재해석해줘. 모든 요소에 같은 fade-up을 반복하지 말고, 각 주요 섹션마다 목적에 맞는 대표 인터랙션을 하나씩 설계해줘. 과한 3D, 긴 스크롤 고정, 큰 확대·축소,
  불필요한 cursor effect는 피하고 콘텐츠 이해와 섹션 구분에 도움이 되는 모션만 사용해줘. 데스크톱에서는 sticky, clip reveal, 약한 parallax 등을 선택적으로 사용하고,
  모바일에서는 가벼운 opacity·translate 기반 모션으로 단순화해줘. prefers-reduced-motion과 스크롤 성능도 대응해줘. 먼저 기존 페이지를 분석하고 섹션별 motion map을
  작성한 다음 구현해줘. 구현 후 PC와 모바일에서 직접 렌더링하고, overflow·레이아웃 시프트·빌드 오류까지 수정해줘.'
