id: fx-discord-computer-use-automation
request_text: '이 브랜치에서 남은 작업 진행하기 전에, discord에 사용자가 직접 명령어를 쳐야 하는 때에 computer use를 이용해 디스코드 데스크톱 앱에서 에이전트가 명령어를
  수행하게 하고 싶어. #나의 목적 1. 내가 일일이 수동으로 커맨드 입력하며 남은 작업을 진행하는 것은 너무 비효율적임. computer use로 대신 커맨드 입력 테스트까지 자동화 하고 싶음 #나의
  제안 1. computer use 이용해서 내가 켜놓은 디스코드 데스크톱 앱을 직접 조작해라. 2. 장기 작업을 이어갈 수 있도록 computer use 사용시 별도의 서브 에이전트또는 스킬을 활용해
  해당 작업을 메인 컨텍스트와 격리 시킬 수 있는 방법이 있을지 분석하고 제안하라. 3. computer use 작업시 sonnet 5로 모델을 지정해 수행시킬 수 있는지 알려달라. 4. 오프보드까지
  남은 모든 작업에서 디스코드 명령어 입력이 필요한 경우 이 방식을 사용해 자동화 할 수 있는지 알려달라.'
