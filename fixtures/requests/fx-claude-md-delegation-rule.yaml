id: fx-claude-md-delegation-rule
request_text: 'claudemd 중 수정해야 할 부분이 있을 것 같아. 1번 항목에서 모호한 부분은 수정하지 말고 유저에게 물어보라고 되어 있는데, 작업을 하다보니 내가 비개발자라서 사실상
  폴더 경로 조차도 파악 못하고 기술적인 의사결정은 대부분 권장사항에 의존한다는 사실을 깨달았어. 아마 앞으로도 바뀌기 힘들 거야. 그래서 차라리 아래 내가 비개발자로서 프로젝트 기술적 의사결정을 하기
  어려운 이유를 적어놨으니 그걸 참고해서, 실제 구현 단위에서의 갈림길에서는 에이전트가 자율적으로 권장 사항 방향으로 자동 처리하되, 유저스토리나 전략 방향 같이 Product manager가 수행하는
  영역에 한해서만 askuserquestion을 사용하도록 하고싶어. 아래 내용 잘 읽고 클로드 md 1번 어떻게 바꿔야 내가 원하는 목표 달성할 수 있을지 알려줘. 아직 내용을 직접 바꾸지 말고,
  아래 전문 아카이브만 해두고 어떻게 바꾸겠다는 계획만 세워. 해당 내용을 바꾸면서 함께 바꿔야 하는 내용이 있으면 알려줘. 비개발자가 개발 인프라에서 멈추는 이유 — 진입장벽 분석 정리 기준일: 2026-07-30
  · 대상: 비개발자·바이브코더의 배포/인프라 단계 이탈 · 관점: Ordi(비개발자용 로컬 바이브코딩 데스크탑 앱) 성격: 1차 정리 노트(외부 리서치 검증 전). 사례·주장은 논증 기반이며 출처
  인용이 붙어 있지 않다 — 카피에 인용할 때는 ../specs/spec-ordi-pricing-ab/audience-and-failure-cases.md 의 검증된 실패 사례로 뒷받침할 것. 관련:
  ../specs/spec-ordi-pricing-ab/landing-copy.md(메시지 축 "프로토타입 이후의 벽") · claude-cowork-위협분석.md 핵심은 회원가입이 어려운 게 아니라,
  가입 직후부터 "내가 뭘 만들고 있는지 구조적으로 이해하고 있다"는 전제 아래 결정을 요구하기 때문이야. 개발자에게 GitHub, Cloudflare, Vercel, Supabase는 각각 역할이
  분명한 도구지만, 비개발자에게는 전부 비슷하게 보인다. "이것도 가입해야 해?" "아까 Lovable에서 만든 건 어디에 있는 거지?" "GitHub에 올리면 배포된 거야?" "Cloudflare는
  서버야, 도메인이야, 보안이야?" "잘못 누르면 서비스가 날아가나?" 이런 혼란이 동시에 발생한다. 1. 가입 과정에서 이미 개발 지식을 요구한다 일반 SaaS 가입은 보통 이렇다. 이메일 입력 비밀번호
  설정 바로 사용 그런데 개발 인프라 도구는 가입 직후부터 이런 걸 물어본다. 개인 계정인가, 조직 계정인가 저장소를 public으로 할 것인가, private으로 할 것인가 GitHub App 권한을
  어디까지 줄 것인가 기존 repository를 연결할 것인가 framework preset은 무엇인가 root directory가 어디인가 production branch는 무엇인가 build command와
  output directory는 무엇인가 DNS record를 어떻게 설정할 것인가 nameserver를 이전할 것인가 environment variable은 무엇인가 개발자는 각각을 작은 설정으로
  보지만, 비개발자는 매 화면마다 알 수 없는 기술적 의사결정을 해야 한다. 즉, 비개발자는 회원가입을 하는 게 아니라 가입 과정에서 계속 작은 아키텍처 결정을 하고 있는 셈이야. 2. 각 도구가 전체
  시스템에서 무슨 역할을 하는지 모른다 비개발자는 보통 결과물 중심으로 생각한다. "나는 웹사이트 하나를 만들고 싶다." 하지만 실제 서비스는 여러 조각으로 나뉜다. 사용자가 원하는 것 실제 필요한
  도구·개념 코드를 보관하고 싶다 GitHub repository 인터넷에 공개하고 싶다 Vercel, Cloudflare Pages, AWS 등 주소를 붙이고 싶다 도메인 등록기관, DNS 로그인
  기능을 만들고 싶다 Supabase Auth, Firebase Auth 등 데이터를 저장하고 싶다 Database API 키를 숨기고 싶다 Environment variables 장애를 확인하고 싶다
  Logs, monitoring 비용 폭탄을 막고 싶다 Billing limit, usage alert 문제는 이 관계가 UI에 설명되어 있지 않다는 거야. GitHub는 자기 자신을 "코드 협업 플랫폼"으로
  설명하고, Cloudflare는 "connect, protect, build everywhere" 같은 언어를 사용한다. 하지만 초보자는 다음과 같은 더 기초적인 설명이 필요하다. "GitHub는
  지금 만든 프로젝트 파일을 안전하게 저장하는 곳입니다." "Cloudflare는 인터넷 주소를 연결하고, 서비스가 사용자에게 도달하도록 돕는 곳입니다." "지금 단계에서는 이 메뉴만 사용하면 됩니다."
  개발자는 이미 머릿속에 인프라 지도가 있기 때문에 각 화면의 의미를 추론할 수 있지만, 비개발자는 그 지도가 없다. 3. 용어를 몰라서가 아니라, 용어 간 관계를 모른다 비개발자도 도메인, 서버,
  GitHub, 배포라는 단어 자체는 들어봤을 수 있다. 하지만 아래 관계는 잘 모른다. 내 컴퓨터의 코드 → GitHub 저장소 → 배포 플랫폼이 GitHub 코드를 가져옴 → 빌드 수행 → 생성된
  서비스 공개 → 도메인의 DNS를 서비스에 연결 → 환경변수와 데이터베이스 연결 그래서 AI가 이렇게 말해도 실행하지 못한다. "GitHub에 push한 뒤 Cloudflare Pages에서 repository를
  연결하고 DNS를 설정하세요." 개발자에게는 한 문장이지만, 비개발자에게는 최소 다섯 개의 미지 작업이다. push가 뭔지 repository가 뭔지 어느 repository를 선택해야 하는지 DNS를
  어디서 바꾸는지 기존 DNS를 바꾸면 이메일이나 홈페이지가 망가지지는 않는지 이들은 용어 번역이 필요한 게 아니라 작업의 인과관계와 순서를 안내받아야 한다. 4. 설정의 결과가 눈에 보이지 않는다
  비개발자가 디자인 툴이나 문서 툴을 쉽게 배우는 이유는 조작 결과가 즉시 보이기 때문이야. 글자 크기를 바꾸면 바로 커진다. 이미지를 옮기면 바로 이동한다. 버튼 색상을 바꾸면 바로 바뀐다. 인프라
  설정은 반대다. DNS를 바꿨는데 바로 반영되지 않을 수 있다. 배포 버튼을 눌렀는데 build failed가 발생한다. GitHub 연동을 했는데 화면상 변화가 거의 없다. 환경변수를 넣었는데 재배포해야
  반영된다. 권한을 승인했는데 무엇이 달라졌는지 보이지 않는다. 즉, 행동과 결과 사이의 연결이 불투명하다. 비개발자 입장에서는 성공했는지조차 모른다. "설정은 끝난 것 같은데, 왜 사이트가 안 열리지?"
  "도메인을 연결한 게 맞나?" "이 오류가 기다리면 해결되는 건지, 내가 잘못한 건지 모르겠다." 이 불확실성이 쌓이면 사용자는 멈춘다. 5. 실수했을 때의 영향 범위를 판단할 수 없다 개발자는 대체로
  설정의 위험도를 구분한다. repository description 변경: 거의 무해 production branch 변경: 배포 영향 가능 environment variable 삭제: 기능 장애
  가능 DNS nameserver 변경: 전체 도메인 영향 가능 GitHub repository 삭제: 매우 위험 비개발자는 이 위험도 차이를 모른다. 그래서 모든 버튼이 위험해 보이거나, 반대로 위험한
  버튼도 가볍게 누를 수 있다. 특히 다음 문구는 초보자에게 강한 불안을 준다. Transfer ownership Delete repository Replace DNS records Change nameservers
  Revoke access Rotate secret Force deployment Production environment Billing overage 이때 사용자는 "이걸 누르면 무슨 일이 일어나는가"보다
  먼저 이렇게 생각한다. "잘못 누르면 지금까지 만든 게 사라질 수 있나?" 즉, 기술적 난이도보다 실수 비용에 대한 불확실성이 더 큰 장벽이다. 6. 계정, 프로젝트, 조직의 경계가 복잡하다 개발
  인프라 도구는 거의 항상 여러 수준의 객체를 가진다. 사용자 계정 └─ Organization / Team └─ Project └─ Repository / Deployment / Domain / Database
  비개발자는 이 구분이 익숙하지 않다. 그래서 자주 생기는 문제가 있다. 개인 GitHub 계정에 만들어야 할지 조직에 만들어야 할지 모름 GitHub repository는 개인 계정에 있고, Vercel
  프로젝트는 다른 팀에 생성됨 Cloudflare 도메인은 회사 계정에 있는데 배포는 개인 계정으로 연결됨 무료 체험으로 가입한 계정과 실제 결제 계정이 다름 Google 로그인, 이메일 로그인, GitHub
  로그인을 서로 다른 계정으로 착각함 AI 에이전트에게 권한을 줬지만 잘못된 organization에 권한을 줌 처음에는 작동할 수 있지만, 나중에 소유권 이전, 팀원 초대, 결제, 유지보수에서 문제가
  터진다. 개발자들은 이를 "계정 정리 문제"로 보지만, 비개발자에게는 어떤 계정이 서비스의 진짜 소유자인지조차 불명확한 상태가 된다. 7. 도구 하나가 아니라 여러 도구 사이를 이동해야 한다 바이브코딩
  도구는 대체로 하나의 화면 안에서 결과물을 만들어준다. 프롬프트 입력 화면 생성 수정 요청 미리보기 확인 사용자는 이 흐름에 익숙해져 있다. 그러나 실제 출시 단계에서는 갑자기 경험이 분절된다. Lovable
  → GitHub → Vercel 또는 Cloudflare → 도메인 등록업체 → Supabase → Google OAuth Console → 이메일 서비스 → 결제 서비스 → 로그 모니터링 각 서비스는
  다음이 모두 다르다. 로그인 방식 UI 구조 용어 권한 체계 요금제 설정 위치 오류 메시지 저장 방식 사용자 관점에서는 하나의 앱을 출시하는 작업인데, 실제로는 서로 협의하지 않는 여러 SaaS를
  직접 조립해야 한다. 바이브코딩이 쉬운 이유는 자연어 인터페이스가 복잡성을 감춰주기 때문인데, 배포 단계에 들어가면 그 복잡성이 한꺼번에 다시 드러나는 거야. 8. AI가 설명은 해줘도 실행 상태를
  확인하지 못한다 Claude나 ChatGPT에게 물어보면 설정 방법을 알려줄 수 있다. 하지만 일반적인 채팅 AI는 사용자의 실제 화면 상태를 모른다. 예를 들어 AI가 말한다. "Settings에서
  Pages를 선택하세요." 그런데 실제로는 다음 변수가 있다. 사용자가 개인 계정이 아니라 organization 화면에 있음 권한이 없어 메뉴가 보이지 않음 UI가 업데이트되어 메뉴 위치가 바뀜
  이미 다른 배포 방식이 설정되어 있음 repository가 선택되지 않음 무료 플랜에서는 해당 기능이 제한됨 도메인이 다른 Cloudflare 계정에 등록되어 있음 사용자는 설명과 자기 화면이 다르면
  바로 막힌다. 그리고 AI에게 다시 이렇게 말한다. "Settings에 Pages가 없는데?" 이후에는 스크린샷을 보내고, 다시 설명을 듣고, 메뉴를 찾고, 오류가 나면 또 질문하는 식으로 진행된다.
  문제는 지식 부족만이 아니라 AI가 현재 시스템 상태를 직접 관찰하고 검증하지 못한다는 것이다. 네 앱이 computer use로 실제 화면을 보고 설정한다면, 이 지점이 굉장히 큰 차별점이 된다.
  9. 오류 메시지가 원인보다 현상을 말한다 개발 인프라의 오류 메시지는 대개 초보자를 위해 작성되지 않았다. 예를 들면: Build command failed with exit code 1 Repository
  access denied Invalid DNS configuration Missing environment variable Deployment not found OAuth redirect URI mismatch
  CORS policy blocked SSL certificate pending Rate limit exceeded 개발자는 로그를 보고 원인을 좁힌다. 비개발자는 오류 메시지를 보고 다음 세 가지를
  구분하지 못한다. 잠시 기다리면 해결되는 문제 설정 한 개만 바꾸면 되는 문제 코드 자체를 수정해야 하는 문제 그래서 오류 한 번이 사실상 작업 종료 지점이 된다. 바이브코더가 프로토타입까지는 잘
  만들고 배포에서 멈추는 이유 중 하나는, 프로토타입 단계의 오류는 AI가 코드 안에서 해결할 수 있지만, 배포 단계의 오류는 코드·계정·권한·DNS·빌드 환경을 모두 함께 확인해야 하기 때문이다.
  10. 비용 구조를 이해하기 어렵다 인프라 도구는 무료로 시작할 수 있지만, 사용량 기반 과금이 많다. bandwidth build minutes database storage function invocation
  edge request egress active user log retention 비개발자는 각각이 실제 서비스 이용량과 어떻게 연결되는지 알기 어렵다. 그래서 두 가지 반응이 나온다. 과도한 공포
  "잘못 배포했다가 갑자기 몇백만 원 나오면 어떡하지?" 위험한 낙관 "Free라고 써 있으니 계속 무료겠지." 가입 과정에서 카드 등록을 요구하거나 사용량 기반 과금을 설명하면, 사용자는 기술 설정과
  비용 위험을 동시에 판단해야 한다. 이것도 출시를 미루게 만드는 주요 원인이다. 11. "완료"의 정의가 없다 프로토타입은 완료 여부가 비교적 명확하다. 화면이 뜨고 버튼이 작동한다. 하지만 서비스
  출시는 완료 조건이 여러 개다. production 배포가 되었는가 사용자 도메인으로 접속되는가 HTTPS가 적용되었는가 모바일에서도 작동하는가 DB가 production 환경과 연결되었는가 비밀키가
  노출되지 않았는가 오류가 기록되는가 관리자 계정이 준비되었는가 백업과 복구 방법이 있는가 비용 알림이 설정되었는가 소유권이 개인이 아니라 적절한 회사 계정에 있는가 비개발자는 어디까지 해야 "출시
  완료"인지 모른다. 그래서 도메인에 접속만 되면 출시됐다고 생각하기도 하고, 반대로 모든 기술을 완벽하게 알아야 한다고 생각해서 영원히 출시하지 못하기도 한다. 개발자가 이 어려움을 과소평가하는 이유
  개발자에게는 이미 축적된 암묵지가 있기 때문이야. 예를 들어 개발자는 GitHub repository 생성 화면에서 다음을 거의 자동으로 판단한다. 이 프로젝트는 private으로 만든다. .gitignore는
  Node를 선택한다. README는 지금 만들어도 된다. 배포 브랜치는 main이다. secret은 repository에 커밋하면 안 된다. 팀 프로젝트면 organization 소유로 만든다. CI가
  실행되도록 GitHub App 권한을 준다. 개발자는 이것을 "버튼 몇 번 누르는 간단한 작업"으로 기억한다. 하지만 실제로는 수십 개의 학습된 판단을 몇 초 만에 수행하고 있는 거야. 비개발자는
  그 판단 기준을 한 번도 배운 적이 없다. 그래서 가장 정확한 표현은 이것이야. 개발 인프라는 조작이 어려운 것이 아니라, 올바른 선택을 하기 위해 필요한 배경지식이 UI 밖에 존재한다. 특히 바이브코더에게
  더 어렵게 느껴지는 이유 바이브코딩은 사용자에게 강한 기대를 만든다. "말로 설명하면 AI가 알아서 만들어준다." 그러다 배포 단계에서 갑자기 다음을 직접 해야 한다. 다른 사이트 가입 카드 등록
  OAuth 권한 승인 repository 연결 DNS 변경 API key 복사 환경변수 등록 빌드 로그 해석 앞 단계에서는 AI가 복잡성을 감춰줬는데, 마지막 20%에서는 오히려 전통적인 개발 인프라의
  복잡성이 그대로 노출된다. 그래서 체감상 더 답답하다. "여기까지는 AI가 다 해줬는데, 왜 갑자기 내가 개발자가 되어야 하지?" 이게 네 타깃이 느끼는 핵심 감정이라고 봐.'
