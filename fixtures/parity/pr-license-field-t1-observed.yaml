#
# 이 케이스는 일치로 세지 않는다. 미실행을 통과로 세면 게이트가 아무것도 증명하지 못한다.
#
# 실행 뒤 채우는 방법(관측 케이스의 형식은 합성 케이스와 다르다):
#   status: executed · source.kind: observed · source.ref: 관측을 기록한 실재 파일의 상대 경로
#   results.<역할>: {file: docs/work/<unit>/result|review/<run-id>-<역할>.json}  ← 한 줄만 적는다
# 봉투를 케이스 파일 안에 인라인으로 적지 않는다. 게이트가 비교하는 값이 바로 그 봉투이므로,
# 손으로 적을 수 있으면 게이트는 아무것도 지키지 않는다. 파일로 지목하면 종료 검사와 같은 앵커 검사
# (스키마·작업 단위·역할·작업 계약 재계산·base_sha·증거 자리·역할 계약 능력)를 그대로 받는다(K-63).
# 그 다섯이 전부 통과한 봉투만 비교 대상이 된다 — 하나라도 어긋나면 PARITY_INVALID 다.
