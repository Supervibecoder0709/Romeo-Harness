# codex 는 FAIL(1건)·FAIL(4건)을, claude 는 PASS(8건)를 냈다. **두 런타임 다 자기 안에서 흔들린다.**
# 그래서 이 케이스는 이제 각 면의 표본을 모두 담고, 검사기가 VERDICT_UNSTABLE 로 판정에서 빼는 것이 옳다.
