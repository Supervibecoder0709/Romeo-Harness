# 검토자-only 재실행의 관측 케이스 — 2026-08-29 재관통에서 RUNBOOK §6.6 을 실행해 얻었다(D-73·D-74).
#
# 교차 관통(pr-license-field-t1-observed)은 두 구현자가 다른 산출물을 만들어 검토자 면이 비교 불가다.
# 검토자 동등성을 판정하려면 **같은 산출물**을 두 검토자에게 보여야 하므로, 기준 실행(run_5a5a894aa26d ·
# 구현자 claude)의 구현자 워크트리를 그대로 두고(트리 ae2611588d7a…) 그 위에서 검토자만 다시 띄웠다.
# 구현자 면은 이 케이스에 없다 — 구현은 한 번뿐이었다.
#
# **각 면 2건씩의 표본을 담는다(D-74).** 한 번의 판정은 그 런타임의 판정이 아니라 그 실행의 판정이다.
# 앞선 라운드(base_sha 6e52900)에서는 codex 가 PASS(0)·FAIL(1)·FAIL(4) 로, claude 가 FAIL(6)·PASS(8) 로
# **양쪽 다 자기 안에서 흔들려** 게이트가 VERDICT_UNSTABLE 로 판정에서 뺐다.
# 이번 라운드의 네 실행은 각 면이 자기 안에서 일관하고 두 면도 같다 — 전부 FAIL 이다.
# 다만 이번에는 check-5(unittest)가 exit 1 이라는 명백한 실패가 산출물에 있었다.
# **판정 난이도가 낮아진 것과 런타임이 안정된 것은 다르고, 이 관측만으로는 구분되지 않는다.**
#
# 네 실행이 같은 것을 봤다는 근거는 케이스 파일이 아니라 실행이 남긴 값이다 — 검토자 계약 네 개가
# cmp identical(sha256 eebccd2302f9…)이고, 봉투가 지목한 증거가 모두 기준 실행의 evidence 이며,
# 각 실행의 review-tree-before/after 가 같은 log_sha256 을 냈다(방어 검사 전부 '유효').
# 봉투를 인라인으로 적지 않는다(D-b). expect 는 관측 결과에 맞춰 고치지 않는다(D-b).
# D-76(2026-08-29): 네 판정이 전부 FAIL 로 같다는 것은 '같은 실패 문자열' 이지 품질이 아니다 — 판정은 advisory 로만 인쇄되고
# 이 케이스가 게이트에 보태는 것은 검토자 봉투의 스키마·계약 동등성뿐이다.
