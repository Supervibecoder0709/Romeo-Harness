# 산출물 동일성 전제가 **핑계가 되지 않는지** 확인하는 케이스(D-73 → D-76).
# **D-76(2026-08-29):** 판정 역할의 판정은 게이트가 아니다. 이 케이스가 검증하는 것은 검사기가 아래 상황을
# `advisory` 로 옳게 요약하는가이다(`expect_advisory`). 종전 결박은 `--judge-verdict strict` 프로파일에만 남아 있다.
#
# 두 면의 산출물이 같다(product 가 같다). 같은 것을 보고도 검토자 판정이 PASS≠FAIL 로 갈렸다면
# 그것은 런타임의 차이일 수도 실행 간 분산일 수도 있다(Q-10). D-76 아래에서 검사기는 이것을 게이트 불일치로 세지 않고
# advisory VERDICT_DIFFERS 로 인쇄해야 한다(strict 프로파일에서는 종전처럼 VERDICT_DIFFERS 불일치다).
# pr-product-differs 와 짝이다: 산출물이 다를 때만 빼고, 같을 때는 지금처럼 비교한다.
#
# 이 케이스는 손으로 쓴 합성 데이터다(source.kind: authored). 검사기가 도는지만 증명하고
# 핵심 동등성 게이트를 통과시키지 못한다(D-b).
# **FAIL 사유 코드(2026-08-30):** 이 케이스의 FAIL 은 전부 '수용 기준이 충족되지 않았다' 는 판정이므로 `AC_UNMET` 이다.
# 결과 계약이 FAIL 봉투에 닫힌 목록의 사유를 요구하게 되면서 기존 표본에 그 코드를 채웠다 — 판정 자체는 바뀌지 않았다.
