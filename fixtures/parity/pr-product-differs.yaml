#
# 두 구현자는 같은 계약에서 같은 검사를 돌려 같은 판정을 냈다 — 구현자 면은 '동일' 이다.
# 그런데 두 면의 산출물이 다르다(product 가 다르다). 검토자의 판정은 자기가 본 산출물의 함수이므로,
# 검토자 판정이 PASS≠FAIL 로 갈린 것은 런타임의 차이가 아니라 산출물의 차이다.
# 검사기는 검토자 면을 VERDICT_DIFFERS 로 세지 않고 PRODUCT_DIFFERS 로 분리해 판정에서 빼되 '비교 불가' 로 인쇄해야 한다.
# 그래서 이 케이스의 기대는 same(구현자 면) + expect_incomparable(검토자 면 PRODUCT_DIFFERS) 이다.
#
# 2026-08-29 실제 관통(pr-license-field-t1-observed)이 정확히 이 모양이었다 — codex 구현자가 archive/README.md 의
# 표 구분선을 잘못 만들었고 claude 검토자가 그것을 잡았다. baseline 산출물에는 그 버그가 없어 codex 검토자의 PASS 도 옳다.
#
# 이 케이스는 손으로 쓴 합성 데이터다(source.kind: authored). 검사기가 도는지만 증명하고
# 핵심 동등성 게이트를 통과시키지 못한다(D-b).
