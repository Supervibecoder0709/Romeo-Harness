# 동등성 케이스 — 역할을 바꿔 다시 실행해도 같은 판정이 나오는가 (핵심 동등성 게이트, 계획 §7 M2).
#
# baseline 은 역할 바인딩의 기준 조합, swapped 는 같은 파일의 역할 교체 조합이다.
# runtimes 는 판정에 쓰지 않는다 — 읽는 사람을 위한 기록이다.
#
# 검토자의 checks 는 비어 있다. 검토자 역할 계약(core/roles/reviewer.yaml)의 capabilities 에
# run-command 가 없으므로 검사를 실행한 것으로 기록할 수 없다(K-66 · F19). 대신 구현자가 남긴
# 증거를 evidence_ref 로 지목한다 — 지목할 증거가 있을 때만 PASS 다(review/SKILL.md 5번).
#
# 이 케이스는 손으로 쓴 합성 데이터다(source.kind: authored). 검사기가 도는지만 증명하고
# 핵심 동등성 게이트를 통과시키지 못한다(D-b).
