request:
  text: AGENTS.md와 docs/migration/AUTOMATION-PLAN.md, docs/migration/CLAUDE-CODE-HANDOFF-2026-08-10.md를 처음부터 끝까지
    읽고 그 계약대로 현재 34개 활성 migration을 이어서 수행해. 먼저 전체 466 테스트와 무잔여 프로세스, 원본 워크트리의 run_506b9817e47d 비공개 cache 상태를 재검증하고,
    문서의 남은 P0를 테스트와 함께 구현해. 그 뒤 새 A deep-read, 새 source preflight, B 읽기 전용 selector와 request discovery, live-ready
    runtime bundle, 파일럿, 5개 배치와 final remainder, 중간저장 재진입, G5, 34개 최종 분류까지 계속해. 자동 게이트가 통과하면 상품별·파일럿별·배치별 승인을 다시
    묻지 마. A/B 로그인·2FA·CAPTCHA만 사용자가 직접 하게 창을 열고 어느 계정인지 알려줘. 비밀번호나 쿠키를 읽거나 요청하지 마. 최종 상품등록, 기존 초안 삭제·수정, A 쓰기, 재고·판매
    변경, 임의값 입력은 금지야. 오래된 schema 1의 0/34 보고서와 과거 auth discovery는 재사용하지 마. 실증되지 않은 것은 COMPLETE로 표시하지 말고 근거 있는 BLOCKED
    상태로 34개 전부 종결해.
  project: coupang-automation
  context: 실 계정 34개. 승인 전 상태 변경 0건.
