request:
  text: 우리 슬랙봇으로 유저 로컬타임 (미국 시간) 기준으로 결제 일어난 건에 대해 알림을 받고 있는데, 이 결제건이 테스트결제 건인지, 유저 결제 건이라면 취소되진 않았는지 db 조회로 확인부탁해
