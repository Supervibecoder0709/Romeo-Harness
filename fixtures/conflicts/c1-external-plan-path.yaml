# K-68 충돌 fixture ① — 이중 기획·고아 산출물 (K-61·K-62)
#
# 부품 원문은 고칠 수 없다(verbatim). 그러니 "경로 언급 금지" 는 성립하지 않는다.
# 대신 **언급이 있으면 대응 override 가 반드시 있어야 한다** 로 검사한다.
# override 가 없으면 에이전트가 그 경로에 고아 산출물을 만들 수 있다.
---
id: c1-external-plan-path
title: 부품이 가리키는 외부 계획 경로에는 흡수 규칙이 있어야 한다
constraints: [K-61, K-62]
kind: pattern_requires_override
scope: projected_skills
patterns:
  - "docs/superpowers/plans"
  - "docs/superpowers/specs"
  - ".superpowers/"
  - "_bmad-output"
  - "openwiki/"
requires_override_key: output_paths
why: >-
  라우터가 만든 docs/work/<id>/ 밖에 산출물이 생기면 종료 검사가 인정하지 않는다.
  원문을 고칠 수 없으므로 지침 파일의 override 로 흡수해야 한다.
