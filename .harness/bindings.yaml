# 역할·런타임 바인딩 (D-68). `romeo compile` 의 입력이다.
#
# 여기서 정한 값이 어댑터 산출물의 "누가 무엇을 하는가" 를 결정한다.
# 모델은 적지 않는다 — 계정 기본값을 쓴다(K-12).
---
schema_version: 1
updated: 2026-08-28

roles:
  implementer:
    runtime: claude
    write: true
    scope: 작업 공간 안의 파일 쓰기·명령 실행
    decided_by: D-68
  reviewer:
    runtime: codex
    write: false
    # 런타임이 강제한다. 실행 전후 git status 비교는 강제 수단이 아니라 방어 검사다(리뷰 F-03).
    enforcement: "codex -s read-only"
    defensive_check: "git status --porcelain 실행 전후 동일"
    scope: 읽기·검색·리뷰 보고서 작성(작업 공간 밖)
    decided_by: D-68

# 역할 교체 재실행 — 동등성 게이트는 이 조합으로도 같은 판정이 나오는지로 판정한다.
parity_swap:
  implementer: codex
  reviewer: claude

# 부품 원문을 고칠 수 없으므로(verbatim, 수정 0) 여기서 덮는다.
# provenance/imports.yaml 의 local_overrides 와 짝이며, 컴파일 시 지침 파일 managed block 에 인쇄된다.
overrides:
  worktree:
    # superpowers using-git-worktrees 가 이름으로 지목하는 네이티브 도구를 대체한다.
    native_tool: "orca worktree create"
    forbid_raw_git_worktree: true
    reason: "전역 Orca 우선 규칙 — raw git worktree add/rm 및 내장 worktree 도구 금지"
    applies_to: [sp-using-git-worktrees]
  review_dispatch:
    # superpowers requesting-code-review 가 지목하는 범용 서브에이전트를 역할 바인딩으로 대체한다.
    target: "roles.reviewer (codex, read-only)"
    reason: "코어를 벤더 중립으로 유지(C-C6). 리뷰는 역할 계약으로만 나간다"
    applies_to: [sp-requesting-code-review]
  integration_commands:
    # superpowers finishing-a-development-branch 의 merge/push/PR/worktree 삭제.
    policy: "메뉴 제시까지만. 실행은 사람의 승인 뒤에"
    denied_without_approval: ["git push", "gh pr merge", "git worktree remove", "git branch -D"]
    reason: "K-66 권한 상한"
    applies_to: [sp-finishing-a-development-branch]
  output_paths:
    # superpowers 본문이 예시로 docs/superpowers/plans/... 를 가리킨다
    # (requesting-code-review SKILL.md:60). 원문을 고칠 수 없으므로 여기서 흡수한다.
    target: "docs/work/<id>/ — 라우터가 만든 작업 단위 폴더"
    external_paths_absorbed:
      - "docs/superpowers/plans"
      - "docs/superpowers/specs"
      - ".superpowers/"
    reason: "K-62 산출물 흡수 — 작업 단위 밖 산출물은 종료 검사가 인정하지 않는다"
    applies_to: [sp-requesting-code-review]

  orchestration:
    # 다중 에이전트 조정은 Orca 가 소유한다(전역 규칙). 보류된 부품이 되살아나도 이 규칙이 우선한다.
    dispatch_tool: "orca orchestration"
    parallel_compare: "race"
    reason: "task/dispatch provenance·lifecycle 이 Orca 에만 생긴다"
    applies_to: [sp-subagent-driven-development, sp-dispatching-parallel-agents]
