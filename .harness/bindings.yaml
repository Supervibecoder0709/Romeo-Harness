# 역할·런타임 바인딩 (D-68). `romeo compile` 의 입력이다.
#
# 여기서 정한 값이 어댑터 산출물의 "누가 무엇을 하는가" 를 결정한다.
# 모델은 적지 않는다 — 계정 기본값을 쓴다(K-12).
---
schema_version: 1
updated: 2026-08-28

# 두 실행(기본·교체)의 네 칸을 모두 채운다. 한 칸이라도 비면 동등성 비교는
# '권한 상한이 서로 다른 두 실행' 을 비교하는 것이 되어 증거가 되지 않는다(리뷰 F-09·F-17).
#
# enforcement          = 그 런타임에서 실제로 권한을 막는 수단(기동 플래그·설정 파일).
# enforcement_observed = 그 수단이 실제로 막는 것을 실행으로 관찰했는가. false 면 완료로 세지 않는다(K-51).
# defensive_check      = 강제 수단이 아니다. 강제가 뚫렸는지 사후에 확인하는 검사다.
roles:
  implementer:
    runtime: claude
    write: true
    scope: 작업 공간 안의 파일 쓰기·명령 실행
    # 쓰기는 허용하되 되돌리기 어려운 명령은 승인 대상이다(K-66).
    # 무엇이 승인 대상인지는 아래 permission_ceiling 이 정하고,
    # 그것을 이 런타임의 패턴 문법으로 옮기는 것은 adapters/claude/adapter.yaml 이다.
    enforcement: ".claude/settings.json 의 permissions.ask·deny (승인 게이트)"
    enforcement_observed: false
    enforcement_note: >-
      승인 프롬프트가 실제로 뜨는지 실행으로 확인하지 않았다. 설정 파일이 존재하는 것은
      강제가 작동한다는 증거가 아니다(K-68).
    decided_by: D-68
  reviewer:
    runtime: codex
    write: false
    # 런타임이 강제한다. 실행 전후 git status 비교는 강제 수단이 아니라 방어 검사다(리뷰 F-03).
    enforcement: "codex exec -s read-only"
    defensive_check: "git status --porcelain 실행 전후 동일"
    enforcement_observed: true
    enforcement_note: >-
      2026-08-28 프로브. 빈 디렉터리에서 파일 생성을 지시하니 patch 가 거부됐다 —
      "writing is blocked by read-only sandbox". 종료 코드 0, 생성된 파일 0건.
      관찰 기록을 .harness/observations.yaml 에 등록하는 것은 아직 남아 있다.
    scope: 읽기·검색·판정(파일 쓰기 없음 — 결과 기록은 검토자를 띄운 쪽의 책임이다)
    decided_by: D-68

# 역할 교체 재실행 — 동등성 게이트는 이 조합으로도 같은 판정이 나오는지로 판정한다.
# 값 두 개짜리 맵이 아니라 역할 블록이다. 교체 실행에도 강제 수단이 있어야 하기 때문이다(리뷰 F-09).
parity_swap:
  implementer:
    runtime: codex
    write: true
    scope: 작업 공간 안의 파일 쓰기·명령 실행
    enforcement: "codex exec -s workspace-write -C <작업 공간>"
    enforcement_observed: false
    enforcement_note: >-
      플래그는 CLI 계약으로 확인했다(codex exec --help — sandbox 값 read-only·workspace-write·
      danger-full-access). 다만 이 런타임의 비대화형 실행에는 승인 정책 플래그가 없다 —
      대화형 실행만 승인 정책을 받는다. 따라서 이 런타임이 구현자일 때 되돌리기 어려운 명령의
      승인 게이트는 런타임이 아니라 하네스가 소유한다: 승인 기록 없이 실행하지 않는다(K-66).
  reviewer:
    runtime: claude
    write: false
    scope: 읽기·검색·판정(파일 쓰기 없음 — 결과 기록은 검토자를 띄운 쪽의 책임이다)
    enforcement: 'claude -p --tools "Read" "Grep" "Glob" --allowedTools "Read" "Grep" "Glob" --strict-mcp-config'
    defensive_check: "git status --porcelain 실행 전후 동일"
    enforcement_observed: true
    enforcement_note: >-
      2026-08-28 프로브 3회. --allowedTools 만 주면 쓰기 도구가 목록에 남아 있고 비대화형이라
      승인을 못 받아 실패한다(약한 보장). --tools 를 함께 주면 내장 쓰기 도구가 사라지지만
      외부 연결 도구가 남아 그쪽으로 쓸 수 있다. 셋을 다 준 실행에서만 사용 가능한 도구가
      Read·Grep·Glob 3개로 관찰됐고 파일은 생성되지 않았다. 관찰 기록을
      .harness/observations.yaml 에 등록하는 것은 아직 남아 있다.

# 권한 상한 — 어느 런타임이 구현자든 같은 상한이 걸려야 한다(K-66 · 리뷰 F-17).
# 여기 목록이 정본이고, 런타임별 표현(설정 파일 패턴·기동 플래그)은 어댑터가 소유한다.
permission_ceiling:
  # 승인 없이 실행하지 않는다. 되돌리기 어렵지만 정당할 수 있는 것들이다.
  # 2026-08-29 사용자 결정으로 범위를 좁혔다. 남긴 기준은 **되돌릴 수 없는 유실**이다 —
  # 지워진 작업 공간·브랜치·미커밋 변경은 복구할 방법이 없고, 병합은 이력을 바꾼다.
  # 뺀 것들(git push · gh pr create · gh pr comment · gh pr review · gh api · git stash ·
  # git worktree add · git worktree prune)은 되돌리는 방법이 있거나 파일을 지우지 않는다.
  #
  # 이 목록이 비었다고 그 행동이 자유로워지는 것은 아니다 — 런타임 프롬프트가 사라질 뿐,
  # "되돌리기 어려운 작업은 영향 범위와 복구 방법을 설명하고 승인을 받는다" 는 규칙(K-66)은
  # 지침으로 남아 있고 AGENTS.core §8 이 그것을 인쇄한다. 기계 강제와 규칙 강제의 차이다.
  approval_required:
    - gh pr merge
    - git worktree remove
    - git branch -D
    - git reset --hard
  # 승인으로도 정당화되지 않는다.
  # 대상은 **그 경로 자체**다 — 그 아래 임시 폴더를 지우는 것까지 막으면
  # 정당한 정리가 막히고, 막힌 이유가 "위험해서" 가 아니라 "패턴이 넓어서" 가 된다.
  never:
    - rm -rf /
    - rm -rf ~
    - sudo rm
    - git push --force
  note: >-
    이 상한은 역할이 아니라 실행에 붙는다. 역할 교체 실행에서 구현자가 바뀌어도 같은 목록이
    적용되지 않으면, 그 두 실행의 판정이 같다는 것은 동등성의 증거가 아니다.
    설정 파일로 기계 강제할 수 없는 런타임에서는 지침 파일에 인쇄해 규칙으로만 강제한다 —
    그 차이는 위 enforcement_observed 로 드러낸다.

# 부품 원문을 고칠 수 없으므로(verbatim, 수정 0) 여기서 덮는다.
# provenance/imports.yaml 의 local_overrides 와 짝이며, 컴파일 시 지침 파일 managed block 에 인쇄된다.
overrides:
  worktree:
    # superpowers using-git-worktrees 가 이름으로 지목하는 네이티브 도구를 대체한다.
    native_tool: "orca worktree create"
    forbid_raw_git_worktree: true
    reason: "전역 Orca 우선 규칙 — raw git worktree add/rm 및 내장 worktree 도구 금지"
    applies_to: [sp-using-git-worktrees]
  review_dispatch:
    # superpowers requesting-code-review 가 지목하는 범용 서브에이전트를 역할 바인딩으로 대체한다.
    target: "roles.reviewer (codex, read-only)"
    reason: "코어를 벤더 중립으로 유지(C-C6). 리뷰는 역할 계약으로만 나간다"
    applies_to: [sp-requesting-code-review]
  integration_commands:
    # superpowers finishing-a-development-branch 의 merge/push/PR/worktree 삭제.
    policy: "메뉴 제시까지만. 실행은 사람의 승인 뒤에"
    denied_without_approval: ["git push", "gh pr merge", "git worktree remove", "git branch -D"]
    reason: "K-66 권한 상한"
    applies_to: [sp-finishing-a-development-branch]
  output_paths:
    # superpowers 본문이 예시로 docs/superpowers/plans/... 를 가리킨다
    # (requesting-code-review SKILL.md:60). 원문을 고칠 수 없으므로 여기서 흡수한다.
    target: "docs/work/<id>/ — 라우터가 만든 작업 단위 폴더"
    external_paths_absorbed:
      - "docs/superpowers/plans"
      - "docs/superpowers/specs"
      - ".superpowers/"
    reason: "K-62 산출물 흡수 — 작업 단위 밖 산출물은 종료 검사가 인정하지 않는다"
    applies_to: [sp-requesting-code-review]

  reviewer_workspace:
    # code-reviewer.md:35 가 "git worktree add /tmp/review-<SHA>" 를 지시한다.
    policy: "다른 리비전이 필요하면 `orca worktree create` 를 쓴다. raw git worktree add 금지"
    original_instruction: "requesting-code-review/code-reviewer.md:35"
    reason: "전역 Orca 우선 규칙 + reviewer 는 이 체크아웃을 바꾸지 않는다"
    applies_to: [sp-requesting-code-review]

  external_writes:
    # receiving-code-review SKILL.md:205 가 gh api 로 PR 댓글을 쓰라고 한다.
    denied_without_approval: ["gh api", "gh pr comment", "gh pr review"]
    original_instruction: "receiving-code-review/SKILL.md:205"
    reason: "K-66 — 저장소 밖 상태를 바꾸는 것은 승인 대상이다"
    applies_to: [sp-receiving-code-review]

  destructive_tdd:
    # test-driven-development SKILL.md:37 이 "Write code before the test? Delete it." 를 강제한다.
    policy: >-
      테스트보다 먼저 쓴 코드를 발견해도 **지우지 않는다**. 무엇을 왜 지워야 하는지 보여주고
      사용자의 승인을 받은 뒤에만 지운다. 미커밋 코드는 복구할 수 없다.
    original_instruction: "test-driven-development/SKILL.md:37-44"
    reason: "K-66 + 되돌릴 수 없는 작업은 승인 뒤에"
    applies_to: [sp-test-driven-development]

  orchestration:
    # 다중 에이전트 조정은 Orca 가 소유한다(전역 규칙). 보류된 부품이 되살아나도 이 규칙이 우선한다.
    dispatch_tool: "orca orchestration"
    parallel_compare: "race"
    reason: "task/dispatch provenance·lifecycle 이 Orca 에만 생긴다"
    applies_to: [sp-subagent-driven-development, sp-dispatching-parallel-agents]
