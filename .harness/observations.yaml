# 그 차이가 런타임의 성질인지 한 번의 누락인지 구분할 수 없었다(Q-08). 런타임을 바꾸지 않고 같은 런타임을
# 두 번 더 돌려 먼저 그것부터 갈랐다.
reviewer_verdict_reproducibility:
  observed_at: 2026-08-29
  unit_id: feat-20260829-license-field-46an
  # 네 실행이 본 것이 같다는 근거 — 손으로 맞춘 값이 아니라 명령이 남긴 값이다
  fixed_product:
    worktree: <기준 실행의 구현자 워크트리>
    head_sha: 6e5290012dd8f088d3ede4b78f4c9e7c31877609
    dirty_tree_hash: 7b035490df840dce0acb7b070ecae1a61b7566e65d8e93f31843e84dc4744d21
