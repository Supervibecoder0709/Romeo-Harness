    **두 런타임 다 자기 안에서 흔들린다.** 같은 산출물·같은 계약·같은 역할에 codex 를 세 번 돌려 PASS 1 · FAIL 2,
    claude 를 두 번 돌려 FAIL 1 · PASS 1 이다. Q-08 의 (c)(이 관측을 근거로 기본 바인딩을 재검토)는 근거를 잃었다 —
    기준 실행의 PASS 는 그 런타임의 성질이 아니라 한 번의 누락이다. 그리고 codex 의 FAIL 한 건(run_5dd1b2c232c7)은
    claude 가 잡은 것을 실질적으로 같이 잡았다 — 루트 오염을 '보는 능력' 의 차이가 아니다.
    claude 의 두 번째 실행은 findings 를 **더 많이**(8건) 내고도 게이트 판정은 PASS 였다 —
    findings 의 수와 게이트 판정이 같은 방향으로 움직이지도 않는다.
  what_this_does_not_say: >-
    **어느 런타임이 더 낫다는 뜻이 아니다.** 표본은 codex 3 · claude 2 이고 어느 쪽도 자기 안에서 일관하지 않았다.
    기동 경로(TUI vs 비대화형)는 교란 변수로 남아 있다 — codex 의 PASS 만 TUI 였고 claude 는 두 번 다 비대화형이었다.
    이 측정은 그 변수를 분리하지 않았다. **왜 흔들리는지도 말하지 않는다** — 판정 기준의 모호함인지, 검토 절차 문서의
    빈자리인지, 모델의 비결정성인지는 이 다섯 실행으로 가려지지 않는다.
  implication_for_gate: >-
    **게이트 정의를 바꿨다(D-74, 사용자 결정 2026-08-29).** 판정 역할의 면은 각 면 2건 이상의 표본을 요구하고,
    표본이 모자라면 `VERDICT_UNSAMPLED`, 표본끼리 갈리면 `VERDICT_UNSTABLE` 로 판정에서 빼되 '비교 불가' 로 인쇄한다 —
    D-73 의 `PRODUCT_DIFFERS` 와 같은 형태다. 관측 케이스 `pr-license-field-t1-reviewer-observed` 는 이제 다섯 봉투를
    모두 담고 `VERDICT_UNSTABLE` 로 빠진다. `expect` 는 고치지 않았다(D-b) — 케이스가 담는 표본을 늘렸을 뿐이다.


# 두 런타임의 결과 계약 스키마 CLI 플래그가 이 저장소의 스키마를 받는가 — 2026-08-29 (체크리스트 29①·40).
