# doctor 는 이 블록을 읽지 않는다(runtime_load 만 읽는다). 사람과 검토자가 읽는 기록이다.
#
# 왜 다시 쟀나: 2026-08-29 관측(RUNBOOK §11.1)은 "run-create 가 터미널을 새 Run 에 바인딩하고 옛 Run 은
# consumer_fenced 로 거부된다" 까지만 말한다. **전환이 되는 것**과 **전환한 뒤 그 Run 을 실제로 읽을 수 있는 것**은
# 별개인데 그 둘을 구분한 기록이 없었고, 그래서 "답장이 워커에게 도달하는지" 를 확인할 방법이 절차에 없었다.
#
# 어디서 쟀나: **별도 터미널**이다. 관측 대상이 바인딩 이동 자체라, 위임된 워커가 자기 터미널에서 run-create 를
# 부르면 자기를 띄운 Run 과의 연결이 끊겨 worker_done 을 보내지 못한다. 이 제약 자체가 관측 결과의 일부다.
#
# 어떻게 묶었나 (2회차): 1회차는 probe 를 그냥 실행하고 stdout 을 파일로 삼켰다. 그 파일도 이 관측 파일도
# `romeo/evidence.py` 의 exclusions() 제외 경로(`.harness` · `docs/work/<id>`)라 어떤 실행에도 묶이지 않았고,
# 검토자가 정확히 그 자리를 FAIL 로 짚었다(findings 2건). 2회차는 같은 스크립트를
# `bin/romeo evidence run --label run-rebinding-probe -- …` 로 감싸 stdout 이 원시 로그와
# `log_sha256`·`stdout_tail` 에 봉인되게 했다. 아래 `sealed_by` 가 그 자리다.
