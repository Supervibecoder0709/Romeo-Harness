  observed_at: 2026-08-29
  schema: core/schemas/result-envelope.json
  codex:
    flag: --output-schema <파일>
    result: >-
      HTTP 400 — "Invalid schema for response_format 'codex_output_schema': In context=('anyOf','0','properties','schema'),
      schema must have a 'type' key."
    cause: >-
      anyOf 의 역할별 제약이 `"schema": {}` 같은 빈 하위 스키마를 쓴다. 그 런타임은 모든 property 에 type 을 요구한다
    observed: 2026-08-29 관통(체크리스트 29①)
  claude:
    flag: --json-schema <내용>
    result: >-
      EXIT=1 · 출력 121바이트 · Error: --json-schema is not a valid JSON Schema: no schema with key or ref
