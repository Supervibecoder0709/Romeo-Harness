# 사람이 세션에서 실제로 관찰한 것만 적는다. 검사기가 증명할 수 없는 항목의 증거다(K-68).
# 추측을 적지 않는다 — 관찰하지 못한 런타임은 항목 자체를 두지 않는다.
#
# runtime_load.<런타임> 은 {observed_at, skills: [세션 목록에서 실제로 본 이름…], note} 다.
# doctor 는 `skills:` 를 지금의 스킬 파일 목록과 **이름으로 대조**해서, 기록이 덮지 못한 스킬이
# 하나라도 있으면 "관찰됨" 이라는 단어를 쓰지 않고 "부분 관찰 · 미관찰 <이름>" 으로 인쇄한다
# (romeo/doctor.py runtime_load_mark). 그러므로 목록에 없는 이름은 관찰되지 않은 것으로 다뤄진다 —
# 목록을 늘리는 것은 관찰한 뒤에만 한다(K-51).
#
# 기록을 지우지 않고 이어 붙인다. 관찰 시점의 개수가 지금 개수와 다르면 그 사실을 note 에 적는다.
---
