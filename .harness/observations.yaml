  observed_at: 2026-08-29
  schema: core/schemas/result-envelope.json
  codex:
    flag: --output-schema <파일>
    result: >-
      HTTP 400 — "Invalid schema for response_format 'codex_output_schema': In context=('anyOf','0','properties','schema'),
