    - run_id: run_5dd1b2c232c7
      runtime: codex
      launch: 비대화형 (codex exec -s read-only -o <워크트리 밖 파일>)
      task_id: task_596c7ac5df3e
      duration_s: 271          # 11:44:42 → 11:49:13
      verdict: FAIL
      findings: 4
      findings_summary: >-
        루트 미추적 아카이브 사본 · 증거가 오염 트리에 묶임 · `Varies by skill` 이 계획 표의 확정 값이 아님 ·
