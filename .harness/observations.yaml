    (a)·(b)·(c) 셋 다 같은 결과를 냈다. **달라진 것은 Run·Task·터미널 id 뿐**이고
    consumer_generation 의 이동(1 → 해제 → 3)까지 같았다.
    **1회차와 다른 것은 관측 내용이 아니라 관측이 묶인 자리다** — 1회차는 stdout 을 파일로 삼켜
    어떤 실행에도 묶이지 않았고(그래서 FAIL), 2회차는 evidence 명령으로 봉인했다(위 sealed_by).
