    **두 런타임 다 자기 안에서 흔들린다.** 같은 산출물·같은 계약·같은 역할에 codex 를 세 번 돌려 PASS 1 · FAIL 2,
    claude 를 두 번 돌려 FAIL 1 · PASS 1 이다. Q-08 의 (c)(이 관측을 근거로 기본 바인딩을 재검토)는 근거를 잃었다 —
    기준 실행의 PASS 는 그 런타임의 성질이 아니라 한 번의 누락이다. 그리고 codex 의 FAIL 한 건(run_5dd1b2c232c7)은
