    - run_id: run_5fc794f15236
      runtime: claude
      launch: 비대화형 (claude -p 3플래그)
      verdict: FAIL
      findings: 6
    - run_id: run_222f508b5541
      runtime: claude
      launch: 비대화형 (claude -p 3플래그)   # run_5fc794f15236 과 같은 프롬프트·같은 계약·같은 강제 수단
      task_id: task_e065a9086f11
      duration_s: 304          # 세션 리포트의 duration_ms 303556
      turns: 25
      tool_use_counts: {Read: 18, Grep: 4, Glob: 2}
      permission_denials: 0
      verdict: PASS
      findings: 8
      findings_summary: >-
        AC-1 검증 공백 · nextlevelbuilder 값이 계획의 단서를 잃음 · `Varies by skill` · 증거에 폐기된 초기 기록 ·
        루트 미추적 12개 · allowed_paths 의 `.` · check-3 이 실패 사유를 확인하지 않음 · spec 의 "넷" 이 실제로는 다섯.
        **findings 가 더 많은데 판정은 PASS 다** — 같은 런타임의 앞 실행(run_5fc794f15236)은 findings 6 으로 FAIL 이었다
