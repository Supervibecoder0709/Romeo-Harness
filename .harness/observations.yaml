    Run 을 셋 이상 만들었을 때, 다른 터미널이 같은 Run 을 가로챘을 때(--takeover-legacy · --from),
    그리고 **워커가 실제로 보낸 메시지가 전환 뒤에도 읽히는지**는 두 회차 다 보지 않았다 — 관측한 인박스는 비어 있었다.
    바인딩이 옮겨간 상태에서 run-show 가 펜싱되는지도 미측정이다. 이 관측은 **명령이 거부되는가**만 말하고,
