# BMAD 를 실제로 설치하고 두 런타임의 discovery 를 관측한 기록 — 2026-08-31 G-M3 5단계 후반.
# doctor 는 이 블록을 읽지 않는다(runtime_load 만 읽는다). 사람과 검토자가 읽는 기록이다.
#
# 왜 적나: 라우터는 이미 BMAD 스킬 11종을 추천하고 있는데 그 스킬들이 설치했을 때 실제로 쓸 수 있는지는
# 아무도 확인한 적이 없었다. capabilities.yaml 의 present 분기도 marker 파일을 흉내 낸 테스트로만 확인됐다.
# 이 블록이 그 두 자리를 실측으로 바꾼다(K-51).
#
# **설치본은 이 저장소에 없다.** 관측은 버리는 워크트리에서 했고 산출물은 .gitignore 로 막혀 커밋되지 않았다 —
# 여기 남는 것은 관측 기록뿐이다. 다른 체크아웃에서 doctor 를 돌리면 discovery.bmad 는 absent 로 인쇄된다.
bmad_install:
  observed_at: '2026-08-31'
  unit_id: feat-20260831-bmad-install-observe-a3bm
  run_id: run_4d3ee0b42e5a
  task_id: task_549f11b68a6f
  dispatch_id: ctx_8fce603b1cd9
  base_sha: 1ae907dda5b820cb4e92c86a73cb8be930cdef50
  evidence: docs/work/feat-20260831-bmad-install-observe-a3bm/evidence/run_4d3ee0b42e5a.yaml
  worktree: 버리는 워크트리(impl4-feat-20260831-bmad-install-observe-a3bm) — 메인 체크아웃은 손대지 않았다
  guard_approvals: [production-deploy, deletion]   # 승인 시점 commands: [] — 승인 전 상태 변경 0건

  # 무엇을 실행했나. 두 번에 나눈 이유는 첫 설치 직후의 대조가 설치기 '자신의' 쓰기를 잡기 때문이다.
  install:
    - step: codex 단독
      command: npx bmad-method install --directory . --modules core,bmm,cis --tools codex --yes
      exit_code: 0
      seconds: 3.164
      result: codex 59 skills → .agents/skills
    - step: 두 런타임 결합(update)
      command: npx bmad-method install --directory . --modules core,bmm,cis --tools codex,claude-code --action update --yes
      exit_code: 0
      seconds: 2.037
      result: codex 59 skills → .agents/skills · claude-code 59 skills → .claude/skills
      why_combined: >-
        `--tools` 는 더하기가 아니라 **교체**다. `--tools claude-code` 만 주면 앞 단계가 깐
        `.agents/skills/bmad-*` 가 제거되고 두 런타임 동시 관측이 성립하지 않는다. 그리고 기존 설치본에
        `--yes` 만 주면 quick-update 로 빠져 `--tools` 를 읽지 않고 exit 0 으로 끝난다 —
        `--action update` 를 함께 줘야 tool 선택이 반영된다. 두 성질 모두 1~4회차에서 실측했다(Q-24).
  installed_versions:                    # _bmad/_config/manifest.yaml 실물에서 읽은 값
    core: 6.11.0 (built-in)
    bmm: 6.11.0 (built-in)
    cis: v0.3.2 (external · npmPackage bmad-creative-intelligence-suite · sha 97298b22fee1c7e482710d3a8414adb5cfccccd9)
    platform_codes: [codex, claude-code]

  # 관측 ① romeo 스킬이 살아남았는가 — 설치 대상이 romeo 스킬이 사는 바로 그 두 디렉터리다
  romeo_skills_intact:
    baseline: docs/work/feat-20260831-bmad-install-observe-a3bm/evidence/skills-before.sha256   # 설치 직전 38개 파일
    checks: 설치 직전 1회 · codex 설치 직후 1회 · 결합 설치 직후 1회 — shasum -a 256 -c 세 번 다 exit 0
    result: 38/38 무손상. 설치기는 기존 파일을 하나도 건드리지 않고 bmad-* 만 더했다

  # 관측 ② 저장소 밖(홈 전역 스킬 디렉터리)에 흔적이 남았는가 — 워크트리 격리로 막히지 않는 위험이었다
  home_dirs_untouched:
    baseline_full: docs/work/feat-20260831-bmad-install-observe-a3bm/evidence/home-skills-before-full.txt   # 63개 파일 · 제외 없음
    baseline_filtered: docs/work/feat-20260831-bmad-install-observe-a3bm/evidence/home-skills-before.txt    # 4개 파일 · */.system/* 제외
    checks: 설치 직후마다 전체 목록(제외 없음)으로 diff — 두 번 다 exit 0
    result: >-
      변화 0. 아카이브 [E09] 가 codex 설치 경로에 적은 전역 `~/.codex/skills` 는 이 버전의 설치기가 쓰지 않는다 —
      `--directory .` 를 주면 저장소 안에만 쓴다. 중단 조건은 발동하지 않았다.
    caveat: >-
      required_checks 의 상시 대조(check-8)는 `*/.system/*` 을 뺀다. codex 런타임을 띄우는 것 자체가
      `~/.codex/skills/.system/` 을 다시 쓰기 때문이고(1회차 관측 · 설치기가 한 일이 아니다),
      이 단위는 codex 를 반드시 띄운다. 설치기 자신의 쓰기는 위의 '설치 직후 제외 없는 대조' 가 잡는다.

  # 관측 ③ 프로브의 present 분기 — 실제 설치본에서 처음 돌았다
  probe:
    command: "bin/romeo doctor 2>&1 | grep -q 'discovery.bmad: present'"
    exit_code: 0
    printed: '· discovery.bmad: present — 설치 흔적 확인 (_bmad/_config/manifest.yaml)'
    reads_resolved: >-
      capabilities.yaml 의 `reads: [modules, platform_codes]` 두 키가 실물 manifest 에 **둘 다 있었다**.
      키 이름은 아카이브 [E05] 서술에서 왔고 그때까지 실물 대조를 하지 않았는데, 이 실행이 그것을 확인했다.
    known_rough_edge: >-
      `modules` 는 dict 리스트라 doctor 가 파이썬 repr 그대로 인쇄한다(datetime 객체 포함). 읽을 수는 있으나
      보기 좋지 않다. 이 단위의 범위가 아니라 고치지 않았고, 관측으로만 남긴다.

  # 관측 ④ 두 런타임이 실제로 bmad-* 를 로드하는가 (AC-5)
  runtime_discovery:
    method: 각 런타임을 이 워크트리에서 띄워 "런타임이 제공한 스킬 목록" 을 인쇄시켰다. 파일 목록(ls)이 아니라 세션의 목록이다
    claude:
      command: claude -p --max-turns 1 --tools "Skill" --allowedTools "Skill" --strict-mcp-config <목록 요청>
      exit_code: 0
      listed_total: 150
