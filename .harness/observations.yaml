      romeo_skills_present: 11/11   # plan · plan-close · implement · review · systematic-debugging · test-driven-development · verification-before-completion · requesting-code-review · receiving-code-review · using-git-worktrees · finishing-a-development-branch
      verdict: 나타났다 — bmad-* 59종이 romeo 스킬 11종과 **함께** 목록에 있었다
      negative_control: >-
        같은 런타임을 검토자 강제 형태(--tools "Read" "Grep" "Glob")로 띄웠을 때는 Skill 도구 자체가 없어
        목록이 비었다("이 세션에는 Skill 도구가 제공되지 않았습니다"). 스킬 목록 관측에는 Skill 도구가 켜져 있어야 한다 —
        이 실행도 증거에 남겼다(cmd runtime-load-claude).
    codex:
      command: codex exec -s read-only --skip-git-repo-check -C <이 워크트리> <목록 요청> < /dev/null
      exit_code: 0
      listed_total: 98
      bmad_prefixed: 59
      romeo_skills_present: 12/12   # 위 11종 + repo-archive
      verdict: 나타났다 — bmad-* 59종이 romeo 스킬 12종과 **함께** 목록에 있었다
    not_recorded_in_runtime_load: >-
      이 관측에서 codex 목록에 `implement` · `review` 가 실제로 있었다. 위 `runtime_load.codex` 블록은
      2026-08-28 기준 10종만 담고 있어 doctor 가 그 런타임을 '부분 관찰' 로 인쇄한다. **그 블록은 고치지 않았다** —
      이 작업 단위의 변경 범위가 아니고, 목록을 늘리는 것은 그 자체를 겨눈 단위에서 한다.

  # 관측 ⑤ agent 없이 workflow SKILL 을 직접 호출하는 경로 (imports.yaml bmad-cis.unverified 가 겨눈 자리)
  workflow_direct_call:
    skill: bmad-cis-design-thinking
    command: claude -p --max-turns 6 --tools "Skill" "Read" "Glob" --allowedTools "Skill" "Read" "Glob" --strict-mcp-config <직접 호출 요청>
    exit_code: 0
    completed: false            # 완주시키지 않았다 — 첫 단계가 시작되는지까지만 본다
    loaded: true
    how_it_loads: >-
      Skill 도구는 `Launching skill: bmad-cis-design-thinking` 한 줄만 반환하고 SKILL.md 본문 전체는
      그다음 user 역할 메시지로 주입된다. 참조 파일(template.md · design-methods.csv · customize.toml)은
      본문에 없고 경로로만 걸린다 — 지연 로드다. base directory 는 `.claude/skills/bmad-cis-design-thinking`
    first_instruction: >-
      워크플로 Step 1 이 아니라 그 앞의 **활성화 Step 1** 이 먼저다:
      `uv run {project-root}/_bmad/scripts/resolve_customization.py --skill {skill-root} --project-root {project-root} --key workflow`.
      즉 첫 지시가 **명령 실행**이다 — 인사도 질문도 문서 읽기도 아니다.
    verdict: >-
      agent 를 거치지 않고 workflow SKILL 을 직접 호출하는 경로는 **성립한다**. 원문 activation 계약
      (workflows.ko.md 15~17)이 서술한 대로 SKILL 이 스스로 시작한다. 이제 서술이 아니라 실행으로 확인됐다.
    flags_for_integration:      # 채택·부착을 실제로 할 때 override 로 다뤄야 할 자리. 이 단위에서는 고치지 않는다
      - 활성화 Step 1 의 fallback 이 스크립트 실패 시 TOML 3종(customize.toml · _bmad/custom/{skill}.toml · .user.toml)을
        모델이 직접 읽어 병합 규칙을 손으로 적용하라고 지시한다 — 설정 해석의 주인이 스크립트에서 LLM 으로 넘어간다
      - 활성화 Step 3 의 `persistent_facts` 가 `file:` glob 을 사실로 적재하고 매칭이 없으면 조용히 건너뛴다 — K-63(부품 자체 상태를 완료 판정에 쓰지 않는다)과 부딪칠 수 있다
      - 기본 출력 경로가 `{output_folder}/design-thinking-{date}.md` 다 — K-62(산출물은 docs/work/<id>/ 안에)와 다르다.
        지금 CLAUDE.md 의 output_paths override 는 `sp-requesting-code-review` 만 대상으로 해서 bmad 계열을 덮지 않는다

  # 관측 ⑥ 설치 뒤에도 하네스 자신이 성립하는가 (AC-4) · 산출물이 git 에 새지 않는가 (AC-7)
  harness_after_install:
    'python3 -m unittest discover -s tests': exit 0 (522 tests OK)
    'bin/romeo validate': exit 0
    'bin/romeo compile --check': exit 0
    'bin/romeo doctor --strict --scope repository': exit 0 (저장소 PASS · 이 머신의 런타임 PASS · 충돌 fixture 0)
    git_leakage: >-
      0건. `.gitignore` 4줄(_bmad/ · _bmad-output/ · .claude/skills/bmad-* · .agents/skills/bmad-*)로 막았고
      `git status --porcelain --untracked-files=all` 에 설치 산출물이 한 건도 뜨지 않는다. 118종(59×2)의 스킬
      디렉터리가 워킹 트리에 있는 상태에서 dirty_tree_hash 가 설치 전후로 같다(5ed1409cd80c)

  conclusion: >-
    **BMAD 는 이 하네스와 공존한다.** 같은 두 디렉터리에 설치되지만 romeo 스킬을 지우지 않고(38/38 무손상),
    두 런타임 모두 bmad-* 59종과 romeo 스킬을 **함께** 로드하며, 설치 뒤에도 하네스의 자기 검사 4종이 전부 통과한다.
    프로브의 present 분기는 실물에서 처음 확인됐고 그 `reads` 키 두 개도 실물에 있었다. agent 없이 workflow SKILL 을
    직접 호출하는 경로도 성립한다. 저장소 밖에는 흔적이 남지 않았다.
  what_this_does_not_say: >-
    **workflow 를 완주시키면 무엇이 나오는지는 보지 않았다** — 첫 단계가 시작되는 것까지만 봤고 산출물 품질은 범위 밖이다.
    라우터가 추천하는 11종 중 실제로 호출해 본 것은 1종(bmad-cis-design-thinking)뿐이다. 나머지 58종은 목록에 이름이
